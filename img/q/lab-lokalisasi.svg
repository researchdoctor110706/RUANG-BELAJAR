<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" width="560" height="240" font-family="Arial,sans-serif"><rect width="560" height="240" fill="#fffef8" stroke="#999"/><text x="20" y="32" font-size="16" font-weight="bold">Pemeriksaan lokalisasi infeksi saluran kemih bawah</text><line x1="20" y1="44" x2="540" y2="44" stroke="#333"/><text x="20" y="66" font-size="13" font-weight="bold">Spesimen</text><text x="280" y="66" font-size="13" font-weight="bold">Leukosit / LPB</text><text x="400" y="66" font-size="13" font-weight="bold">Kultur (CFU/mL)</text><rect x="16" y="76" width="528" height="30" fill="#f1efe4"/><text x="20" y="96" font-size="13">VB1 (10 mL pertama)</text><text x="280" y="96" font-size="13">2–3</text><text x="400" y="96" font-size="13">sedikit (&lt; 10³)</text><text x="20" y="128" font-size="13">VB2 (porsi tengah)</text><text x="280" y="128" font-size="13">0–1</text><text x="400" y="128" font-size="13">steril</text><rect x="16" y="140" width="528" height="30" fill="#f1efe4"/><text x="20" y="160" font-size="13">EPS (setelah pijat prostat)</text><text x="280" y="160" font-size="13">25–30</text><text x="400" y="160" font-size="13">E. coli 10⁴</text><text x="20" y="192" font-size="13">VB3 (10 mL setelah pijat)</text><text x="280" y="192" font-size="13">15–20</text><text x="400" y="192" font-size="13">E. coli 10⁴</text><text x="20" y="228" font-size="11" fill="#555">Pasien laki-laki 44 tahun, saat ini tidak demam</text></svg>