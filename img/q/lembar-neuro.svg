<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" width="480" height="330" font-family="Arial,sans-serif"><rect width="480" height="330" fill="#fff"/><rect x="10" y="10" width="460" height="310" fill="#fffdf6" stroke="#c9b98a"/><text x="22" y="36" font-size="15" font-weight="bold" fill="#5a4a1e">LEMBAR PEMERIKSAAN NEUROLOGIS · ICU</text><text x="22" y="64" font-size="12" font-weight="bold">Kesadaran</text><text x="190" y="64" font-size="12">GCS E1 M1 Vt, tanpa sedasi > 24 jam</text><line x1="20" x2="460" y1="73" y2="73" stroke="#eadfbd"/><text x="22" y="92" font-size="12" font-weight="bold">Pupil</text><text x="190" y="92" font-size="12">6 mm / 6 mm, refleks cahaya (−/−)</text><line x1="20" x2="460" y1="101" y2="101" stroke="#eadfbd"/><text x="22" y="120" font-size="12" font-weight="bold">Refleks kornea</text><text x="190" y="120" font-size="12">(−/−)</text><line x1="20" x2="460" y1="129" y2="129" stroke="#eadfbd"/><text x="22" y="148" font-size="12" font-weight="bold">Refleks okulosefalik</text><text x="190" y="148" font-size="12">(−)</text><line x1="20" x2="460" y1="157" y2="157" stroke="#eadfbd"/><text x="22" y="176" font-size="12" font-weight="bold">Refleks okulovestibular</text><text x="190" y="176" font-size="12">(−/−) dengan 50 mL air es</text><line x1="20" x2="460" y1="185" y2="185" stroke="#eadfbd"/><text x="22" y="204" font-size="12" font-weight="bold">Refleks muntah dan batuk</text><text x="190" y="204" font-size="12">(−) saat suction</text><line x1="20" x2="460" y1="213" y2="213" stroke="#eadfbd"/><text x="22" y="232" font-size="12" font-weight="bold">Tes apnea</text><text x="190" y="232" font-size="12">PaCO₂ 42 → 68 mmHg, tidak ada napas spontan</text><line x1="20" x2="460" y1="241" y2="241" stroke="#eadfbd"/><text x="22" y="260" font-size="12" font-weight="bold">Hemodinamik</text><text x="190" y="260" font-size="12">TD 102/64 dengan norepinefrin, irama sinus</text><line x1="20" x2="460" y1="269" y2="269" stroke="#eadfbd"/><text x="22" y="288" font-size="12" font-weight="bold">Pemeriksa</text><text x="190" y="288" font-size="12">2 dokter independen, diulang 6 jam: sama</text><line x1="20" x2="460" y1="297" y2="297" stroke="#eadfbd"/></svg>