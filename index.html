   {f:"repro/panggul-wanita-pria", cap:"Panggul wanita vs pria: pada wanita pintu atas lebih bulat dan lebar, sudut subpubis (arkus pubis) lebih dari 90°, dan rongga panggul lebih dangkal. Bentuk inilah yang memberi ruang untuk kepala janin.", lab:"Female = wanita · Male = pria · Pelvic brim = pintu atas panggul · Subpubic angle = sudut subpubis"}],
  anat:["Panggul = 2 os coxae (ilium, iskium, pubis) + sakrum + koksigis, disatukan sendi sakroiliaka dan simfisis pubis.","Pintu atas panggul (PAP): promontorium – linea terminalis – tepi atas simfisis. Konjugata vera ±11 cm, konjugata diagonalis ±12,5 cm (vera ≈ diagonalis − 1,5 cm), diameter transversa ±13 cm.","Bidang tengah panggul setinggi spina iskiadika: diameter interspinarum ±10 cm, diameter terkecil jalan lahir.","Pintu bawah panggul: diameter anteroposterior ±11,5 cm, diameter intertuberosum ±11 cm, arkus pubis normal >90°.","Bidang Hodge: H I = PAP; H II sejajar H I setinggi tepi bawah simfisis; H III setinggi spina iskiadika (= stasion 0); H IV setinggi ujung koksigis.","Tipe Caldwell–Moloy: ginekoid (PAP bulat, paling sering), android (bentuk hati, menyempit ke bawah), antropoid (lonjong ke depan-belakang), platipeloid (pipih, lebar ke samping)."],
  histo:["Tulang panggul: tulang kompakta di luar, spongiosa di dalam berisi sumsum merah.","Simfisis pubis: sendi fibrokartilago. Relaksin dan progesteron melonggarkan simfisis dan sendi sakroiliaka saat hamil.","Dasar panggul: m. levator ani (puborektalis, pubokoksigeus, iliokoksigeus) adalah otot rangka; perineal body adalah simpul jaringan fibromuskular di antara vagina dan anus."],
  fisio:["Saat hamil ligamen panggul melonggar sehingga panggul sedikit lebih lentur, tapi muncul nyeri simfisis dan cara jalan 'bebek'.","Pintu atas panggul paling lebar ke samping, pintu bawah paling lebar ke depan-belakang. Karena itu kepala janin harus berputar (putar paksi dalam) saat turun.","Posisi McRoberts (paha ditekuk ke perut) memutar simfisis ke atas dan meluruskan sakrum sehingga ruang pintu bawah bertambah."],
  klinis:["Panggul sempit atau kepala besar → disproporsi kepala panggul (CPD) → partus macet, bahaya ruptur uteri (KUL 10).","Stasion dan bidang Hodge dipakai di partograf dan sebagai syarat ekstraksi vakum (KUL 7, 8).","Manuver McRoberts pada distosia bahu (KUL 10).","Robekan perineum derajat 1–4 dan episiotomi (KUL 8)."],
  tes:[["Diameter terkecil jalan lahir dan letaknya?","Diameter interspinarum ±10 cm di bidang tengah panggul, setinggi spina iskiadika (Hodge III)."],["Konjugata diagonalis 11 cm. Berapa konjugata vera dan artinya?","±9,5 cm (diagonalis − 1,5 cm), berarti PAP sempit (<10 cm)."],["Tipe panggul dengan prognosis persalinan pervaginam terbaik?","Ginekoid."]]},
 {id:"uterus", nm:"Uterus, serviks, tuba & ovarium", kul:"KUL 2, 3, 7, 8, 9, 10",
  imgs:[
   {f:"repro/genital-wanita", cap:"(a) Potongan sagital: uterus antefleksi di antara kandung kemih (depan) dan rektum (belakang); serviks menonjol ke vagina. (b) Tampak depan: tuba, ovarium, dan ligamen penggantung.", lab:"Uterus = rahim · Uterine tube (oviduct) = tuba fallopi · Cervix = serviks · Vagina = vagina · Ovary = ovarium · Broad ligament = lig. latum · Ovarian ligament = lig. ovarii proprium · Fimbriae = fimbria"},
   {f:"repro/uterus-tuba-ovarium", cap:"Uterus dan adneksa: tuba terbagi menjadi bagian interstisial, istmus, ampula, dan infundibulum berfimbria. Gambar kecil menunjukkan mikroskop dinding uterus: endometrium, miometrium, perimetrium.", lab:"Fundus = fundus · Body = korpus · Isthmus = istmus · Ampulla = ampula · Infundibulum = infundibulum · Endometrium/Myometrium/Perimetrium = endometrium/miometrium/perimetrium · Uterine artery = a. uterina"},
   {f:"repro/folikel", cap:"Tahap folikel di ovarium (mikroskop): primordial → primer → sekunder → tersier (de Graaf) → ovulasi → korpus luteum → korpus albikans.", lab:"Primordial/Primary/Secondary/Tertiary follicle = folikel primordial/primer/sekunder/tersier · Granulosa cells = sel granulosa · Theca cells = sel teka · Antrum = antrum · Corpus luteum = korpus luteum"},
   {f:"repro/siklus-ovarium-uterus", cap:"Siklus ovarium dan siklus endometrium berjalan bersama: fase folikular (FSH, estrogen) → lonjakan LH dan ovulasi hari ±14 → fase luteal (progesteron) → menstruasi bila tidak hamil.", lab:"Follicular phase = fase folikular · Ovulation = ovulasi · Luteal phase = fase luteal · Menses = menstruasi · Proliferative/Secretory phase = fase proliferasi/sekresi"}],
  anat:["Uterus: fundus, korpus, istmus (menjadi segmen bawah rahim saat hamil), dan serviks dengan ostium internum dan eksternum.","Posisi tersering antefleksi-antefersi; ditopang lig. kardinale (Mackenrodt), uterosakral, rotundum, dan latum.","A. uterina (cabang a. iliaka interna) menyilang di atas ureter setinggi serviks, lalu beranastomosis dengan a. ovarika.","Tuba: interstisial – istmus – ampula (tempat fertilisasi dan kehamilan ektopik tersering) – infundibulum dengan fimbria.","Ovarium di fossa ovarika, digantung lig. suspensorium (berisi a/v ovarika) dan lig. ovarii proprium."],
  histo:["Endometrium: epitel kolumnar selapis, kelenjar, dan stroma; lapisan fungsionalis luruh saat haid, lapisan basalis untuk regenerasi.","Saat hamil endometrium berubah menjadi desidua (sel stroma membesar berisi glikogen); desidua basalis menjadi bagian ibu dari plasenta.","Miometrium: otot polos tebal; serat lapisan tengah beranyaman seperti angka 8 sehingga menjepit pembuluh darah saat berkontraksi ('living ligature').","Serviks: endoserviks kolumnar penghasil lendir, ektoserviks epitel gepeng berlapis tidak berkeratin; batasnya zona transformasi.","Tuba: epitel kolumnar bersilia dan sel sekretorik (peg cell). Silia dan peristaltik mendorong ovum ke uterus."],
  fisio:["Siklus endometrium: proliferasi (estrogen) → sekresi (progesteron) → menstruasi bila korpus luteum mati.","Saat hamil uterus membesar dari ±70 g menjadi ±1.100 g, terutama karena hipertrofi sel otot.","Serviks hamil melunak (tanda Goodell) dan kebiruan (tanda Chadwick); sumbat lendir menutup kanalis servikalis.","Kontraksi Braxton Hicks: tidak teratur, tidak nyeri, tidak membuka serviks."],
  klinis:["Kehamilan ektopik paling sering di ampula tuba (KUL 2).","Segmen bawah rahim yang tipis: lokasi insisi seksio sesarea transversal, juga lokasi ruptur uteri dan cincin Bandl (KUL 8, 10).","Atonia uteri = miometrium gagal berkontraksi → perdarahan pascapersalinan (KUL 3, 7).","Serviks inkompeten → keguguran atau persalinan preterm trimester 2 tanpa nyeri, ditangani serklase (KUL 9).","Plasenta akreta: desidua basalis tidak terbentuk baik (misalnya bekas SC) sehingga vili melekat ke miometrium (KUL 3)."],
  tes:[["Hubungan a. uterina dengan ureter?","A. uterina menyilang di atas ureter ±2 cm lateral serviks, sehingga ureter berisiko terpotong saat histerektomi."],["Lapisan endometrium yang luruh saat haid?","Stratum fungsionalis; stratum basalis tetap untuk regenerasi."],["Kenapa kontraksi miometrium menghentikan perdarahan setelah plasenta lahir?","Serat otot beranyaman menjepit pembuluh darah ('living ligature')."]]},
 {id:"konsepsi", nm:"Fertilisasi & implantasi", kul:"KUL 2, 4",
  imgs:[
   {f:"repro/fertilisasi", cap:"Fertilisasi: ratusan sperma menembus korona radiata, enzim akrosom melubangi zona pelusida, lalu satu sperma menyatu dengan membran oosit.", lab:"Corona radiata = korona radiata · Zona pellucida = zona pelusida · Acrosome = akrosom · Oocyte = oosit"},
   {f:"repro/pembelahan-implantasi", cap:"Perjalanan hasil konsepsi: oosit dibuahi di ampula → 2 sel → 4 sel → 8 sel → morula (16 sel) → blastokista (70–100 sel) → menetas dari zona pelusida dan menanam di endometrium.", lab:"Fertilized oocyte = zigot · Morula = morula · Blastocyst = blastokista · Trophoblast = trofoblas · Inner cell mass = massa sel dalam (embrioblas)"},
   {f:"repro/implantasi", cap:"Implantasi: blastokista mencerna mukosa uterus lalu terbenam seluruhnya di endometrium, paling sering di dinding posterior-superior korpus uteri. Gambar kanan bawah: tempat implantasi tersering.", lab:"Endometrium = endometrium · Uterine cavity = kavum uteri · Implanted embryo = embrio yang tertanam"},
   {f:"repro/trofoblas", cap:"Embrio minggu ke-2: trofoblas terbagi menjadi sitotrofoblas (dalam) dan sinsitiotrofoblas (luar, invasif, penghasil hCG). Diskus embrio dua lapis: epiblas dan hipoblas.", lab:"Cytotrophoblast = sitotrofoblas · Syncytiotrophoblast = sinsitiotrofoblas · Epiblast/Hypoblast = epiblas/hipoblas · Amniotic cavity = rongga amnion"}],
  anat:["Ovulasi melepas oosit sekunder (berhenti di metafase II) yang dibungkus zona pelusida dan korona radiata, lalu ditangkap fimbria.","Fertilisasi di ampula tuba, biasanya dalam 24 jam setelah ovulasi; sperma bisa bertahan ±3–5 hari.","Zigot membelah sambil berjalan ke uterus: morula ±hari 3–4, blastokista ±hari 5.","Implantasi ±hari 6–7 setelah fertilisasi, biasanya di dinding posterior-superior korpus uteri."],
  histo:["Blastokista: massa sel dalam/embrioblas (menjadi janin), trofoblas (menjadi plasenta), dan rongga blastokel.","Sitotrofoblas membelah aktif; sinsitiotrofoblas berinti banyak, menembus endometrium, dan membuat hCG.","Minggu ke-3 terjadi gastrulasi: tiga lapis germinal (ektoderm, mesoderm, endoderm)."],
  fisio:["Reaksi akrosom membuat sperma bisa menembus zona pelusida; reaksi korteks oosit mencegah lebih dari satu sperma masuk (polispermia).","Setelah sperma masuk, oosit menyelesaikan meiosis II; dua pronukleus bergabung menjadi zigot 46 kromosom.","hCG terdeteksi di serum ±8–11 hari setelah konsepsi; tugasnya mempertahankan korpus luteum agar progesteron tetap tinggi.","Di awal kehamilan normal, kadar hCG naik kira-kira 2 kali tiap 48 jam."],
  klinis:["Implantasi di luar kavum uteri = kehamilan ektopik; ampula tersering (KUL 2).","Mola komplet: ovum tanpa inti dibuahi lalu kromosom ayah menggandakan diri (46,XX) → tanpa janin. Mola parsial: triploid 69 kromosom (KUL 2).","hCG yang naik terlalu lambat → curiga kehamilan ektopik atau abortus; terlalu tinggi → curiga mola atau gemeli (KUL 2).","Kembar monozigot: hari terjadinya pembelahan menentukan jumlah korion dan amnion (KUL 4)."],
  tes:[["Di mana fertilisasi normal terjadi?","Ampula tuba fallopi."],["Sel penghasil hCG?","Sinsitiotrofoblas."],["Kariotipe mola komplet vs parsial?","Komplet 46,XX (semua dari ayah); parsial triploid 69,XXY atau 69,XXX."]]},
 {id:"plasenta", nm:"Plasenta, selaput & tali pusat", kul:"KUL 3, 4, 5",
  imgs:[
   {f:"repro/plasenta-skema", cap:"Struktur plasenta: vili korialis berisi kapiler janin terendam darah ibu di ruang intervili. Darah ibu dan darah janin tidak bercampur; zat berpindah menembus dinding vili.", lab:"Chorionic villi = vili korialis · Intervillous space = ruang intervili · Umbilical arteries/vein = a. umbilikalis/v. umbilikalis · Amnion/Chorion = amnion/korion · Yolk sac = kantung kuning telur"},
   {f:"repro/arteri-spiralis", cap:"(A) Cangkang trofoblas dan vili jangkar plasenta. (B) Remodeling arteri spiralis: sel trofoblas ekstravili (eCTB, iCTB) mengganti dinding otot arteri sehingga pembuluh menjadi lebar dan bertahanan rendah. Gagal remodeling = dasar preeklamsia dan FGR.", lab:"SA = spiral artery (arteri spiralis) · TV = trophoblast villi · STB = sinsitiotrofoblas · vCTB/eCTB/iCTB = sitotrofoblas vili/endovaskular/interstisial · uNK = sel NK uterus · decidua basalis = desidua basalis", cr:WMC+", 'Development of the trophoblastic shell and formation of placental anchoring villi' (CC BY 4.0)"},
   {f:"repro/plasenta-foto", cap:"Plasenta sungguhan setelah lahir. Di kala III plasenta selalu diperiksa: kelengkapan kotiledon, selaput, dan jumlah pembuluh tali pusat.", lab:""},
   {f:"repro/plasenta-lahir", cap:"Plasenta manusia sesaat setelah dilahirkan (12 menit setelah bayi). Periksa kelengkapan kotiledon di sisi ibu: kotiledon yang tertinggal bisa menyebabkan perdarahan pascapersalinan.", lab:"", cr:WMC+", 'Human placenta just after delivery' (CC BY-SA 4.0)"},
   {f:"repro/selaput-embrio", cap:"Selaput janin dan lapisan germinal: amnion membungkus rongga amnion, korion di luarnya. Tiap lapis germinal (ektoderm, mesoderm, endoderm) menjadi organ tertentu.", lab:"Amnion = amnion · Chorion = korion · Amniotic cavity = rongga amnion · Allantois = alantois · Endoderm/Mesoderm/Ectoderm = endoderm/mesoderm/ektoderm"},
   {f:"repro/plasenta-previa", cap:"Letak plasenta normal (fundus/korpus) dibanding plasenta previa yang menutupi ostium internum serviks sehingga menghalangi jalan lahir.", lab:"Normal location of placenta = letak normal · Placenta previa = plasenta previa · Internal os = ostium internum"}],
  anat:["Plasenta aterm: cakram diameter ±15–20 cm, tebal ±2–3 cm, berat ±500 g.","Sisi ibu: 15–20 kotiledon, merah dan kasar. Sisi janin: licin, dilapisi amnion, tempat tali pusat menempel.","Tali pusat: 2 arteri (membawa darah miskin O2 dari janin) dan 1 vena (membawa darah kaya O2 ke janin) dalam jeli Wharton; panjang ±50–60 cm.","Selaput ketuban: amnion (dalam, tanpa pembuluh darah) dan korion (luar)."],
  histo:["Vili korialis: inti mesenkim dengan kapiler janin, dilapisi sitotrofoblas (makin jarang di trimester 3) dan sinsitiotrofoblas.","Ruang intervili diisi darah ibu dari arteri spiralis. Tipe plasenta manusia: hemokorial.","Sawar plasenta makin tipis seiring usia kehamilan sehingga pertukaran zat makin mudah.","Pada preeklamsia: infark plasenta, aterosis akut arteri spiralis, dan sinsitial knot bertambah."],
  fisio:["O2 dan CO2 lewat difusi sederhana; glukosa lewat difusi terfasilitasi (GLUT1); IgG lewat transpor aktif melalui reseptor FcRn; IgM tidak bisa lewat.","Plasenta adalah kelenjar endokrin: hCG, hPL (antiinsulin), progesteron, estrogen, dan CRH.","Arteri spiralis diremodel trofoblas sehingga lebar, bertahanan rendah, dan tidak bisa menyempit.","Cairan amnion: setelah ±16 minggu sumber utamanya urin janin, dibuang lewat ditelan janin; volume terbanyak ±1 L sekitar 34–36 minggu."],
  klinis:["Plasenta previa: menutupi atau dekat ostium → perdarahan tanpa nyeri (KUL 3).","Solusio plasenta: plasenta lepas sebelum bayi lahir → nyeri dan uterus tegang (KUL 3).","Vasa previa: pembuluh janin di selaput melintasi ostium → darah janin keluar saat ketuban pecah (KUL 3).","Gagal remodeling arteri spiralis → preeklamsia dan FGR (KUL 4, 5).","IgG anti-D ibu melewati plasenta → hemolisis janin (KUL 4).","Oligohidramnion: agenesis ginjal atau obstruksi saluran kemih janin; polihidramnion: atresia esofagus, anensefali, diabetes (KUL 4)."],
  tes:[["Isi tali pusat normal?","2 arteri dan 1 vena; arteri membawa darah miskin O2 dari janin."],["Antibodi apa yang bisa melewati plasenta?","IgG (lewat reseptor FcRn). IgM tidak."],["Kenapa gagal remodeling arteri spiralis berbahaya?","Pembuluh tetap sempit dan reaktif → plasenta iskemia → faktor antiangiogenik (sFlt-1) naik → preeklamsia dan FGR."]]},
 {id:"janin", nm:"Janin: sirkulasi & kepala", kul:"KUL 4, 6, 7, 9, 10",
  imgs:[
   {f:"repro/sirkulasi-janin", cap:"Sirkulasi janin dengan 3 jalan pintas: duktus venosus (melewati hati), foramen ovale (atrium kanan ke kiri), dan duktus arteriosus (a. pulmonalis ke aorta).", lab:"Umbilical vein/arteries = v./a. umbilikalis · Ductus venosus = duktus venosus · Foramen ovale = foramen ovale · Ductus arteriosus = duktus arteriosus · Inferior vena cava = vena kava inferior"},
   {f:"repro/sirkulasi-saat-lahir", cap:"Perubahan sirkulasi saat lahir: foramen ovale menutup menjadi fossa ovalis, duktus arteriosus menutup menjadi ligamentum arteriosum, duktus venosus menjadi ligamentum venosum.", lab:"Before birth = sebelum lahir · After birth = sesudah lahir · Fossa ovalis = fossa ovalis · Ligamentum venosum = lig. venosum"},
   {f:"repro/tengkorak-bayi", cap:"Tengkorak bayi baru lahir: tulang dipisahkan sutura dan ubun-ubun (fontanel). Ubun-ubun besar (anterior) belah ketupat, ubun-ubun kecil (posterior) segitiga, dan keduanya dipakai sebagai penunjuk posisi kepala saat periksa dalam.", lab:"Frontal bone = os frontal · Parietal bone = os parietal · Occipital bone = os oksipital · Anterior fontanelle = ubun-ubun besar · Posterior fontanelle = ubun-ubun kecil · Frontal suture = sutura frontalis"}],
  anat:["Tulang kepala janin: 2 frontal, 2 parietal, 1 oksipital, dipisahkan sutura sagitalis, koronaria, lambdoidea, dan frontalis.","Ubun-ubun besar: belah ketupat, pertemuan 4 sutura. Ubun-ubun kecil: segitiga, pertemuan 3 sutura.","Diameter kepala: suboksipitobregmatika ±9,5 cm (fleksi maksimal), oksipitofrontalis ±11,5 cm (puncak kepala), mentooksipitalis ±13 cm (dahi, terbesar), submentobregmatika ±9,5 cm (muka).","Tiga shunt sirkulasi janin: duktus venosus, foramen ovale, duktus arteriosus."],
  histo:["Pneumosit tipe II mulai membuat surfaktan ±24 minggu; paru cukup matang ±34–36 minggu.","Sutura dan fontanel berupa jaringan ikat fibrosa sehingga tulang bisa bertumpuk (molase) saat melewati panggul.","Kulit janin dilapisi verniks kaseosa (sebum dan sel epitel) yang melindungi kulit dari cairan amnion."],
  fisio:["Darah vena umbilikalis paling kaya O2; sebagian langsung ke vena kava inferior lewat duktus venosus.","Di atrium kanan, darah kaya O2 diarahkan lewat foramen ovale ke atrium kiri lalu ke otak dan jantung.","Darah dari vena kava superior ke ventrikel kanan dan a. pulmonalis, lalu sebagian besar lewat duktus arteriosus ke aorta karena paru janin bertahanan tinggi.","Saat lahir: napas pertama menurunkan tahanan paru, tali pusat dijepit menaikkan tahanan sistemik → foramen ovale menutup; O2 naik dan prostaglandin turun → duktus arteriosus menutup.","Hemoglobin janin (HbF) mengikat O2 lebih kuat daripada HbA ibu."],
  klinis:["Presentasi dahi memakai diameter terbesar (mentooksipitalis) sehingga tidak bisa lahir pervaginam bila menetap (KUL 10).","Kaput suksedaneum melewati sutura; sefalhematoma dibatasi sutura (KUL 8, 10).","Doppler a. umbilikalis: aliran diastolik hilang atau terbalik berarti tahanan plasenta sangat tinggi (KUL 4, 6).","Kortikosteroid antenatal mempercepat pematangan paru untuk mencegah sindrom gawat napas (KUL 9)."],
  tes:[["Diameter kepala pada presentasi belakang kepala dengan fleksi maksimal?","Suboksipitobregmatika ±9,5 cm."],["Shunt yang membawa darah vena umbilikalis melewati hati?","Duktus venosus."],["Beda kaput suksedaneum dan sefalhematoma?","Kaput: edema di bawah kulit, melewati sutura, hilang dalam beberapa hari. Sefalhematoma: darah di bawah periosteum, dibatasi sutura, hilang dalam minggu–bulan."]]},
 {id:"hamil", nm:"Tubuh ibu saat hamil", kul:"KUL 1, 3, 5",
  imgs:[
   {f:"repro/fundus-trimester", cap:"Tinggi fundus uteri tiap akhir trimester: makin tua kehamilan, fundus makin tinggi sampai mendekati prosesus xifoideus di ±36 minggu.", lab:"End of 1st/2nd/3rd trimester = akhir trimester 1/2/3"},
   {f:"repro/hormon-kehamilan", cap:"Kadar hormon selama kehamilan: hCG memuncak ±8–10 minggu lalu turun; estrogen dan progesteron terus naik sampai aterm karena dibuat plasenta.", lab:"Human chorionic gonadotropin = hCG · Estrogens = estrogen · Progesterone = progesteron · Weeks of pregnancy = minggu kehamilan"}],
  anat:["Tinggi fundus: 12 minggu di atas simfisis, 20 minggu setinggi pusat, 36 minggu di prosesus xifoideus, lalu sedikit turun saat kepala masuk panggul.","Rumus McDonald: tinggi fundus (cm) kira-kira sama dengan usia kehamilan (minggu) pada 20–36 minggu.","Payudara membesar, areola menggelap, muncul tuberkel Montgomery.","Kulit: linea nigra, striae gravidarum, melasma."],
  histo:["Payudara: estrogen menumbuhkan duktus, progesteron menumbuhkan alveoli; produksi ASI ditahan progesteron sampai plasenta lahir.","Endometrium berubah menjadi desidua (reaksi desidua).","Korpus luteum gravidarum membuat progesteron sampai plasenta mengambil alih di ±7–10 minggu."],
  fisio:["Volume plasma naik ±40–50%, massa eritrosit hanya ±20–30% → hemodilusi (anemia fisiologis). Anemia hamil menurut WHO: Hb <11 g/dL.","Curah jantung naik ±30–50%; tekanan darah turun di trimester 2.","Telentang di trimester 3 → uterus menekan vena kava inferior → hipotensi; ibu dimiringkan ke kiri.","GFR naik ±50% sehingga kreatinin serum turun; ureter melebar karena progesteron dan tekanan uterus.","Ventilasi semenit naik (efek progesteron) → PaCO2 turun ±30 mmHg.","Hiperkoagulasi: fibrinogen dan faktor VII, VIII, X naik → risiko trombosis.","Resistensi insulin di paruh kedua kehamilan (hPL, progesteron, kortisol)."],
  klinis:["Tinggi fundus tidak sesuai usia kehamilan → curiga FGR, gemeli, polihidramnion, atau makrosomia (KUL 1, 4).","Kreatinin yang normal pada orang tidak hamil bisa sudah tidak normal pada ibu hamil (KUL 5).","Resusitasi ibu hamil: geser uterus ke kiri supaya aliran balik vena tidak terhambat (KUL 3).","Hiperkoagulasi ditambah solusio atau perdarahan masif → KID (KUL 3).","Diabetes gestasional muncul karena resistensi insulin trimester 2–3, maka skrining di 24–28 minggu (KUL 5)."],
  tes:[["Fundus setinggi pusat kira-kira usia kehamilan berapa?","±20 minggu."],["Kenapa Hb ibu hamil turun padahal eritrosit bertambah?","Volume plasma naik lebih banyak (40–50%) daripada massa eritrosit (20–30%) → hemodilusi."],["Kenapa diabetes gestasional diskrining di 24–28 minggu?","Hormon plasenta yang melawan insulin (hPL dan lainnya) naik bermakna di paruh kedua kehamilan."]]},
 {id:"persalinan", nm:"Persalinan", kul:"KUL 7, 8, 9, 10",
  imgs:[
   {f:"repro/tahap-persalinan", cap:"Tahap persalinan: (1) pembukaan serviks sampai ±10 cm, (2) kelahiran bayi: kepala lahir, putar paksi luar, bahu dan badan lahir, (3) kelahiran plasenta.", lab:"Stage 1: Dilation = kala I: pembukaan · Stage 2: Birth = kala II: bayi lahir · Stage 3: Afterbirth delivery = kala III: plasenta lahir · Umbilical cord = tali pusat"}],
  anat:["Segmen atas rahim aktif berkontraksi dan beretraksi; segmen bawah rahim pasif, meregang, dan menipis.","Batas keduanya adalah cincin retraksi fisiologis. Bila sangat tinggi dan teraba di perut disebut cincin Bandl, tanda ruptur uteri mengancam.","Serviks mengalami pendataran (effacement) lalu pembukaan 0–10 cm.","Jalan lahir lunak: serviks, vagina, dasar panggul, perineum."],
  histo:["Pematangan serviks: kolagen dipecah, asam hialuronat dan air bertambah sehingga serviks lunak.","Estrogen menambah reseptor oksitosin dan gap junction (koneksin-43) sehingga sel miometrium berkontraksi serentak.","Retraksi: setelah kontraksi, serat miometrium tidak kembali ke panjang semula sehingga rongga uterus makin kecil."],
  fisio:["Awal persalinan: efek progesteron menurun, CRH plasenta dan kortisol janin naik, estrogen naik, prostaglandin (PGE2, PGF2α) naik.","Refleks Ferguson: kepala menekan serviks → oksitosin dilepas → kontraksi makin kuat (umpan balik positif).","Kala I laten lalu aktif (WHO 2018: fase aktif mulai ±5 cm). Kala II: pembukaan lengkap sampai bayi lahir. Kala III: bayi lahir sampai plasenta lahir. Kala IV: 2 jam pertama setelah plasenta lahir.","Tujuh gerakan kardinal: engagement → penurunan → fleksi → putar paksi dalam → ekstensi → putar paksi luar → ekspulsi.","Tanda plasenta lepas: tali pusat memanjang, semburan darah, uterus membulat dan naik."],

function vFisioRepro(){
  return '<div class="grid2">'+
    fcard("Hormon kehamilan", '<div class="flow"><span class="node">Sinsitiotrofoblas → hCG (puncak ±8–10 mgg)</span><span class="arr">→</span><span class="node">Korpus luteum bertahan</span><span class="arr">→</span><span class="node">Progesteron tinggi</span><span class="arr">→</span><span class="node">±7–10 mgg plasenta ambil alih</span></div><ul class="small" style="margin:8px 0 0;padding-left:1.1em"><li>Progesteron: menenangkan miometrium, menutup serviks.</li><li>Estrogen: menumbuhkan uterus dan payudara, menambah reseptor oksitosin menjelang aterm.</li><li>hPL: melawan insulin supaya glukosa tersedia untuk janin (dasar diabetes gestasional).</li></ul>')+
    fcard("Jantung & darah ibu", '<ul class="small" style="margin:0;padding-left:1.1em"><li>Volume plasma naik ±40–50%, eritrosit ±20–30% → Hb turun (hemodilusi).</li><li>Curah jantung naik ±30–50%; tahanan perifer turun; tekanan darah paling rendah di trimester 2.</li><li>Telentang di trimester 3 → kompresi aortokaval → hipotensi. Miringkan ke kiri.</li><li>Fibrinogen dan faktor VII, VIII, X naik → hiperkoagulasi (melindungi dari perdarahan saat lahir, tapi risiko trombosis).</li></ul>')+
    fcard("Ginjal, napas & metabolisme", '<ul class="small" style="margin:0;padding-left:1.1em"><li>GFR naik ±50% → kreatinin dan ureum turun; glukosuria ringan bisa normal.</li><li>Progesteron merangsang pusat napas → ventilasi naik → PaCO2 ±30 mmHg (alkalosis respiratorik terkompensasi).</li><li>Paruh kedua kehamilan: resistensi insulin naik → skrining diabetes gestasional 24–28 minggu.</li></ul>')+
    fcard("Sirkulasi uteroplasenta", '<div class="flow"><span class="node">A. uterina</span><span class="arr">→</span><span class="node">A. arkuata → radialis</span><span class="arr">→</span><span class="node">A. spiralis (diremodel trofoblas)</span><span class="arr">→</span><span class="node">Ruang intervili</span></div><p class="small" style="margin:8px 0 0">Aliran darah uterus aterm ±500–750 mL/menit. Arteri spiralis yang sudah diremodel lebar dan tidak bisa menyempit, jadi aliran ke plasenta tergantung tekanan darah ibu. Remodeling gagal → plasenta iskemia → preeklamsia dan FGR.</p>')+
    fcard("Kenapa persalinan dimulai", '<ul class="small" style="margin:0;padding-left:1.1em"><li>Efek progesteron menurun secara fungsional (reseptornya berubah).</li><li>CRH plasenta dan kortisol janin naik → estrogen naik.</li><li>Estrogen menambah reseptor oksitosin dan gap junction → miometrium berkontraksi serentak.</li><li>Prostaglandin mematangkan serviks dan memicu his.</li><li>Refleks Ferguson: kepala menekan serviks → oksitosin → his makin kuat.</li></ul>')+
    fcard("Kala persalinan", '<div class="flow"><span class="node">Kala I: laten → aktif (±5 cm, WHO 2018)</span><span class="arr">→</span><span class="node">Kala II: lengkap → bayi lahir</span><span class="arr">→</span><span class="node">Kala III: bayi → plasenta lahir</span><span class="arr">→</span><span class="node">Kala IV: 2 jam pemantauan</span></div><p class="small" style="margin:8px 0 0">His efektif: teratur, makin sering, makin lama, makin kuat. Segmen atas menebal (retraksi), segmen bawah menipis.</p>')+
    fcard("Mekanisme persalinan (7 gerakan)", '<div class="flow"><span class="node">Engagement</span><span class="arr">→</span><span class="node">Penurunan</span><span class="arr">→</span><span class="node">Fleksi</span><span class="arr">→</span><span class="node">Putar paksi dalam</span><span class="arr">→</span><span class="node">Ekstensi</span><span class="arr">→</span><span class="node">Putar paksi luar</span><span class="arr">→</span><span class="node">Ekspulsi</span></div><p class="small" style="margin:8px 0 0">Fleksi membuat kepala masuk dengan diameter terkecil (suboksipitobregmatika ±9,5 cm). Putar paksi dalam terjadi karena pintu atas panggul lebar ke samping, sedangkan pintu bawah lebar ke depan-belakang.</p>')+

/* Di artifact claude.ai, unduhan lewat izin "downloads"; di GitHub Pages pakai link biasa. */
let DLNS = null;
if (window.claude && window.claude.use) window.claude.use("downloads").then(d => { DLNS = d; }).catch(() => {});
document.addEventListener("click", async e => {
  const a = e.target.closest && e.target.closest("a.dl"); if (!a || !DLNS) return;
  e.preventDefault();
  const name = a.dataset.name, isDoc = name.endsWith(".docx"), old = a.textContent;
  a.textContent = "Menyiapkan…";
  try {
    const r = await fetch("files/" + name + (isDoc ? ".b64.txt" : "")); if (!r.ok) throw { code: "http " + r.status };
    let data;
    if (isDoc) { const bin = atob((await r.text()).trim()); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); data = new Blob([u]); }
    else data = await r.blob();
    await DLNS.save({ filename: name, data });
    a.textContent = old;
  } catch (err) {
    a.textContent = err && err.code === "declined" ? old : "Gagal, coba lagi";
    if (!(err && err.code === "declined")) setTimeout(() => { a.textContent = old; }, 3000);
  }
}, true);

function termify(html, g){
  const span = (k, t) => '<span class="term" tabindex="0" data-g="'+esc(g[k])+'" data-t="'+esc(k)+'">'+t+'</span>';
  const done = new Set();
  let out = html.replace(/\[\[([^\]]+)\]\]/g, (m, t) => { const k = Object.keys(g).find(x => x.toLowerCase() === t.toLowerCase()); if (k) done.add(k); return k ? span(k, t) : t; });
  /* istilah glosarium tanpa [[ ]]: tandai kemunculan pertama di teks (bukan di dalam tag) */
  Object.keys(g).sort((a,b) => b.length - a.length).forEach(k => {
    if (done.has(k)) return;
    const re = new RegExp('(^|[^\\p{L}\\p{N}])('+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(?![\\p{L}\\p{N}])', 'iu');
    const parts = out.split(/(<[^>]+>)/); let inTerm = 0;
    for (let i = 0; i < parts.length; i++){
      const p = parts[i];
      if (p.startsWith('<')){ if (/^<span class="term"/.test(p)) inTerm++; else if (inTerm && p === '</span>') inTerm--; continue; }
      if (inTerm || !re.test(p)) continue;
      parts[i] = p.replace(re, (m, a, t) => a + span(k, t)); done.add(k); break;
    }
    out = parts.join("");
  });
  return out;
}

/* ---------- PROGRES ---------- */
function readiness(){
  const L = lecs(); if (!L.length) return {score:0, steps:0, quiz:0, conf:0};
  const steps = L.reduce((a,l) => a + STEPS.filter(s => stepOf(l.id,s.n).done).length, 0) / (L.length*5);
  const qsc = []; blockQuizzes().forEach(q => { const h = (S.quiz[q.id]||{}).hist||[]; if (h.length) qsc.push(h[h.length-1].score/(q.qs||[]).length); });
  const quiz = qsc.length ? qsc.reduce((a,b)=>a+b,0)/qsc.length : 0;
  const cs = L.map(l => S.conf[l.id]||0).filter(Boolean); const conf = cs.length ? cs.reduce((a,b)=>a+b,0)/cs.length/5 : 0;
  return {score:Math.round((steps*0.55 + quiz*0.3 + conf*0.15)*100), steps, quiz, conf};
}
function topicStats(){
  const by = {};
  blockQuizzes().forEach(q => { const rec = S.quiz[q.id]; if (!rec || !rec.graded) return; const d = S.drafts[q.id]||{}; (q.qs||[]).forEach((x,i) => { by[x.topic] = by[x.topic]||{c:0,n:0}; by[x.topic].n++; if (d[i]===x.a) by[x.topic].c++; }); });
  return by;
}
function vProgres(){
  const r = readiness(); const t = todayISO(); const sch = schedule(); const ts = topicStats();
  const weak = [];
  lecs().forEach(l => { const c = S.conf[l.id]; const lateN = sch.filter(x => x.lid===l.id && x.late).length;
    if (c && c <= 2) weak.push({t:"KUL "+l.no+" "+l.title, why:"kamu nilai paham "+c+"/5", go:"#kuliah"});
    else if (lateN >= 3) weak.push({t:"KUL "+l.no+" "+l.title, why:lateN+" milestone tertunda", go:"#kuliah"}); });
  Object.keys(ts).forEach(k => { const p = ts[k].c/ts[k].n; if (p < 0.6) weak.push({t:"Topik "+k, why:"latsol "+ts[k].c+"/"+ts[k].n+" benar", go:"#latsol"}); });
  return '<div class="view-head"><span class="eyebrow">Menuju UAB</span><h2>Progres UAB</h2><p>Kesiapan dihitung dari milestone selesai (55%), nilai latsol terakhir (30%), dan seberapa paham menurutmu (15%).</p></div>'+
  '<div class="grid3"><div class="card stack"><span class="eyebrow">Kesiapan UAB</span><div class="score">'+r.score+'<span style="font-size:1.3rem;color:var(--muted)">%</span></div><div class="meter"><i style="width:'+r.score+'%"></i></div></div>'+
  '<div class="card stack"><span class="eyebrow">Milestone</span><div class="score" style="font-size:2.2rem">'+Math.round(r.steps*100)+'%</div><div class="meter"><i style="width:'+Math.round(r.steps*100)+'%;background:var(--peri)"></i></div></div>'+
  '<div class="card stack"><span class="eyebrow">Rata-rata latsol</span><div class="score" style="font-size:2.2rem">'+Math.round(r.quiz*100)+'%</div><div class="meter"><i style="width:'+Math.round(r.quiz*100)+'%;background:var(--aqua)"></i></div></div></div>'+
  '<div class="card stack"><h3>Yang perlu diperhatikan</h3>'+(weak.length ? '<div class="stack">'+weak.map(w => '<a href="'+w.go+'" class="task" style="text-decoration:none;color:inherit"><div class="dot" style="background:var(--bad)">!</div><div class="t"><b>'+esc(w.t)+'</b><span>'+esc(w.why)+'</span></div><span class="btn tiny">Buka</span></a>').join("")+'</div>' : '<div class="empty">Belum ada topik lemah yang terdeteksi. Isi "seberapa paham" di tiap KUL dan kerjakan latsol supaya bagian ini terisi.</div>')+'</div>'+
  '<div class="card stack"><h3>Peta milestone per KUL</h3><div class="tbl"><table class="heat"><tr><th></th>'+STEPS.map(s => '<th title="'+esc(s.nm)+'" class="mono small">'+s.n+'</th>').join("")+'<th class="small">Paham</th></tr>'+lecs().map(l => '<tr><th class="small">KUL '+l.no+' <span class="muted">'+esc(l.title.length>28?l.title.slice(0,28)+"…":l.title)+'</span></th>'+STEPS.map(s => { const v = stepOf(l.id,s.n); const late = !!(sch.find(x => x.lid===l.id && x.n===s.n)||{}).late; return '<td><span class="c" style="background:'+(v.done?s.color:late?'#FFD5D7':'var(--soft)')+'">'+(v.reps?v.reps:"")+'</span></td>'; }).join("")+'<td class="mono small" style="padding-left:6px">'+(S.conf[l.id]?S.conf[l.id]+"/5":"–")+'</td></tr>').join("")+'</table></div><p class="small muted">Kotak berwarna = selesai, merah muda = telat, angka = berapa kali diulang.</p></div>'+
  (Object.keys(ts).length ? '<div class="card stack"><h3>Akurasi per topik (latsol)</h3><div class="bars">'+Object.keys(ts).map(k => { const p = Math.round(ts[k].c/ts[k].n*100); return '<div class="bar"><span>'+esc(k)+'</span><div class="meter"><i style="width:'+p+'%;background:'+(p>=70?'var(--ok)':p>=50?'var(--warn)':'var(--bad)')+'"></i></div><span class="mono small">'+p+'%</span></div>'; }).join("")+'</div></div>' : '');

/* dengarkan (text-to-speech bawaan browser) */
function speak(el){
  try {
    const ss = window.speechSynthesis; if (!ss) { toast("Browser ini belum mendukung suara"); return; }
    if (ss.speaking) { ss.cancel(); document.querySelectorAll(".speak.on").forEach(b => { b.classList.remove("on"); b.textContent = "▶ Dengarkan"; }); if (el.classList.contains("on")) return; }
    const u = new SpeechSynthesisUtterance(el.dataset.text); u.lang = "id-ID"; u.rate = 0.98;
    const v = ss.getVoices().find(v => /id(-|_)ID/i.test(v.lang)); if (v) u.voice = v;
    u.onend = () => { el.classList.remove("on"); el.textContent = "▶ Dengarkan"; };
    el.classList.add("on"); el.textContent = "■ Berhenti"; ss.speak(u);
  } catch(err){ toast("Suara tidak tersedia di sini"); }
}

/* confetti kecil */
function confetti(){
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  paras:[
   ["A","For much of the twentieth century, bilingualism was viewed with suspicion. Educators warned that children exposed to two languages would become confused, and early studies appeared to confirm that bilingual children scored lower on intelligence tests. In retrospect, these studies were deeply flawed: many compared immigrant children who were still learning the language of the test with monolingual children from wealthier backgrounds."],

   ["C","The idea attracted enormous media attention, partly because of claims that bilingualism might delay the onset of dementia by several years. For parents and policymakers, the message was irresistible: learning a second language was not only useful for communication but also a form of mental exercise."],
   ["D","In the last decade, however, the 'bilingual advantage' has come under sustained criticism. Several large studies, some involving thousands of participants, have failed to find any consistent difference in executive control between bilinguals and monolinguals. Critics have also identified a publication bias: studies that found an advantage were far more likely to be published than those that did not, creating a misleadingly positive picture of the evidence."],
   ["E","Defenders of the theory respond that 'bilingualism' is not a single experience. Someone who uses two languages every day in very different settings may differ greatly from someone who learned a second language at school and rarely uses it. Grouping such people together, they argue, may hide real effects that occur only under certain conditions."],
   ["F","In my view, the most reasonable conclusion is a modest one. The cognitive benefits of bilingualism, if they exist, are probably smaller and less universal than once claimed. Yet this hardly weakens the case for learning languages, which rests on far more solid ground: access to other cultures, wider career opportunities and the ability to communicate with millions more people. Those reasons were valid long before anyone measured reaction times in a laboratory, and they remain valid today."]

  steps:["Garis bawahi kata kunci soal: 'just as effective', 'to what extent'. Soal ini minta POSISIMU, dan posisi itu harus konsisten dari intro sampai kesimpulan.","Intro (2 kalimat): (1) parafrase soal, jangan copy; (2) thesis statement yang jelas, mis. 'I largely disagree, because…'.","Body: kalimat topik → jelaskan KENAPA → contoh spesifik → kaitkan balik ke posisimu.","Sisakan 3 menit untuk cek: artikel (a/the), -s jamak, subject-verb agreement."],
  useful:["It is often argued that…","While online learning offers undeniable flexibility, …","I would argue that… largely because…","This is particularly evident in…","A case in point is…","Consequently, …","For this reason, …"],
  model:`In recent years, the rapid expansion of internet-based courses has led some to claim that learning online is equally as effective as attending lessons in person. While I accept that digital learning has clear advantages in terms of flexibility, I largely disagree with this view, as face-to-face teaching remains superior for developing practical skills and sustaining motivation.

The most compelling reason is that many forms of knowledge cannot be fully acquired through a screen. This is particularly evident in fields such as medicine, nursing or engineering, where students must practise physical procedures under direct supervision. A medical student, for instance, may watch dozens of videos on how to examine a patient's abdomen, yet only by doing so in a clinical setting, with a tutor correcting the position of their hands, will they master the technique. Moreover, classroom learning provides immediate, spontaneous interaction: a puzzled expression can prompt a teacher to rephrase an explanation, something that is far harder to detect in a video call with cameras switched off.

A second consideration is motivation. Studying alone at home demands considerable self-discipline, and online courses are known for their high drop-out rates. In a physical classroom, by contrast, fixed timetables, peer pressure and the simple presence of classmates help learners to stay on track.

Admittedly, online platforms are invaluable for revising theory, accessing world-class lecturers and fitting study around work or family commitments. However, these benefits make online learning a useful complement to traditional education rather than an equal substitute for it.

In conclusion, although studying online is convenient and suitable for certain purposes, I believe that classroom learning remains more effective overall, particularly for practical subjects and for learners who need structure to remain motivated.`,

  model:`The line graph illustrates how many tourists stayed overnight in three European cities, namely Hamburg, Lucerne and Bruges, over a twenty-year period from 2000 to 2020.

  model:`Public health has become a pressing concern in many countries, as rates of obesity, diabetes and heart disease continue to rise. While some argue that building more sports facilities is the most effective solution, others maintain that such investment would achieve little on its own. In my view, sports facilities are beneficial but insufficient, and they must form part of a wider strategy.

Those who favour sports facilities point out that a sedentary lifestyle is one of the leading risk factors for chronic illness. If people have convenient access to swimming pools, cycling lanes and affordable gyms, they are more likely to exercise regularly, which helps to prevent weight gain, lower blood pressure and improve mental well-being. Community sports centres can also bring people together, reducing the social isolation that is itself associated with poor health.

   {q:"What are the negative effects of mass tourism on local communities?", m:"The most visible problem is overcrowding. In places like Hallstatt in Austria, the number of daily visitors can be many times the local population, which makes ordinary life quite difficult for residents. There's also an economic side: when too many flats are rented out to tourists, housing becomes unaffordable for local people. So although tourism brings income, it can gradually change the character of a place."},
   {q:"How could governments manage tourism better?", m:"I think a combination of measures is needed. Some cities have introduced tourist taxes or daily visitor limits, which can reduce pressure while raising money for maintenance. Another approach is to promote lesser-known destinations so that visitors are spread more evenly. Ideally, though, local residents should have a say in these decisions, since they're the ones most affected."},
   {q:"Is it necessary to learn the local language before visiting a country?", m:"Necessary, probably not, since English and translation apps will get you quite far. But I'd argue it's extremely worthwhile to learn at least a few basic phrases. It shows respect, and in my experience people respond far more warmly when you make an effort, even if your pronunciation isn't perfect."},
   {q:"Do you think children should start learning foreign languages at a young age?", m:"Generally, yes. Young children tend to pick up pronunciation more naturally, and they're less afraid of making mistakes than adults. That said, I don't think age is everything. What matters more is the quality and amount of exposure. A child who has one short lesson a week may not progress much, whereas an adult who studies consistently and uses the language every day can reach a very high level."},
   {q:"Will people still need to learn languages in the future, given advances in translation technology?", m:"That's an interesting question. Translation tools will certainly become more accurate, and for practical things like ordering food or reading signs, they may be enough. However, I don't think they'll replace language learning altogether, because a language carries humour, culture and emotion that a machine struggles to convey. Building a genuine friendship, or comforting a patient, for example, requires more than an accurate translation."}
  ],
  phrases:["I'd say there are several factors.","On a deeper level, …","…have a say in… (punya suara/hak bicara)","Necessary, probably not, but…","That said, …","…will get you quite far"]}

 G1:{title:"Kalimat kompleks: relative & participle clauses",
  lesson:`<p><b>Kenapa penting?</b> Grammatical Range band 7+ butuh <i>variasi kalimat kompleks</i> yang tetap akurat. Dua alat paling praktis: relative clause dan participle clause.</p>
<p><b>1. Defining relative clause</b> (tanpa koma) = informasi yang WAJIB untuk tahu siapa/apa yang dimaksud.<br><i>Students <u>who sleep well</u> remember more.</i></p>
<p><b>2. Non-defining relative clause</b> (pakai koma) = info tambahan. Tidak boleh pakai <i>that</i>.<br><i>Hamburg, <u>which</u> is Germany's second-largest city, has a huge port.</i> (BUKAN <i>, that is…</i>)</p>

 G2:{title:"Artikel, jamak & subject-verb agreement",
  lesson:`<p><b>Kenapa ini dulu?</b> Bahasa Indonesia tidak punya artikel, jamak wajib, atau perubahan kata kerja per subjek. Akibatnya tiga hal ini adalah kesalahan paling sering penutur Indonesia, dan examiner menghitungnya di <i>Grammatical Accuracy</i>. Band 9 = kesalahan seperti ini hampir tidak ada.</p>
<p><b>1. a / an</b> = benda tunggal yang bisa dihitung, disebut pertama kali / tidak spesifik: <i>She is <u>a</u> doctor.</i> (WAJIB, jangan "She is doctor").<br><b>the</b> = spesifik/sudah diketahui/satu-satunya: <i><u>the</u> internet, <u>the</u> government, <u>the</u> elderly</i>.<br><b>Tanpa artikel</b> = makna umum dengan jamak/uncountable: <i><u>Exercise</u> improves <u>health</u>. <u>Doctors</u> work long hours.</i></p>
<p><b>2. Uncountable</b> (tidak pernah +s, tidak pakai a): <i>information, advice, research, evidence, knowledge, equipment, homework, traffic, furniture</i>. Pakai <i>a piece of advice, much research</i>.</p>
<p><b>3. Subject-verb agreement</b>: cari subjek INTI, abaikan frasa di tengah.<br><i>The number of tourists <u>has</u> increased.</i> (subjek = the number)<br><i>A number of tourists <u>have</u> complained.</i> (= many tourists)<br><i>One of the main reasons <u>is</u>…</i> · <i>Everyone <u>has</u>…</i></p>`,

 G3:{title:"Conditionals & inversion (range band 8–9)",
  lesson:`<p><b>Kenapa?</b> Band 9 grammar = 'wide range of structures with full flexibility'. Conditional campuran dan inversion menunjukkan kontrol tinggi, asal dipakai secara natural, jangan dipaksakan di setiap kalimat.</p>
<p><b>Zero</b> (fakta): <i>If you heat ice, it melts.</i><br><b>First</b> (mungkin terjadi): <i>If cities build more parks, residents <u>will</u> be healthier.</i><br><b>Second</b> (hipotesis sekarang): <i>If I <u>lived</u> in Hamburg, I <u>would</u> cycle everywhere.</i><br><b>Third</b> (masa lalu, tidak terjadi): <i>If I <u>had studied</u> earlier, I <u>would have passed</u>.</i><br><b>Mixed</b> (masa lalu → efek sekarang): <i>If I <u>had learned</u> German as a child, I <u>would be</u> fluent now.</i></p>
<p><b>Alternatif 'if'</b>: <i>unless, provided that, as long as, otherwise</i>.<br><b>Inversion</b> (formal): <i><u>Had I known</u>, I would have come.</i> (= If I had known) · <i><u>Should you</u> need help, call me.</i> · <i><u>Not only does</u> exercise improve fitness, <u>but it also</u> reduces stress.</i> · <i><u>Rarely do</u> we see such results.</i></p>`,
  ex:[

   {q:"If she had revised more, she ____ the exam.", o:["would pass","will pass","would have passed","passed"], a:2, why:"Third conditional: had + V3 → would have + V3."},
   {q:"If I had taken that job in Zurich, I ____ in Switzerland now.", o:["would live","would be living","will live","had lived"], a:1, why:"Mixed: masa lalu (had taken) → keadaan sekarang (would be living / would live). 'Would be living' paling tepat karena 'now'."},
   {q:"____ I known about the strike, I would have taken a different train.", o:["If","Had","Have","Should"], a:1, why:"Inversion third conditional: Had I known = If I had known."},
   {q:"Not only ____ green spaces improve health, but they also reduce flooding.", o:["do","are","that","can't"], a:0, why:"Not only + auxiliary + subject: Not only do green spaces improve…"},
   {q:"You won't improve your writing ____ you get feedback.", o:["if","unless","provided","as long as"], a:1, why:"Unless = if not."},

   ["A","For centuries, napping in the afternoon was regarded in many industrialised societies as a sign of laziness. Yet in large parts of the world, from Spain to Indonesia, a short rest after lunch has long been part of daily life. Scientists are now paying closer attention to this habit, and much of the evidence suggests that a well-timed nap can sharpen the mind."],

const ENG_SECS = [["L","Listening"],["R","Reading"],["W","Writing"],["S","Speaking"],["H","Hasil"]];
function engRound(x){ return Math.round(x*2)/2; }
function engTestBands(T){
  const e = E(), b = {};
  if (e.sc[T.L]) b.L = engBand(e.sc[T.L].s/e.sc[T.L].t, "listen");
  if (e.sc[T.R]) b.R = engBand(e.sc[T.R].s/e.sc[T.R].t, "read");
  if (e.ai[T.W] && e.ai[T.W].band) b.W = +e.ai[T.W].band;
  if (e.ai[T.S] && e.ai[T.S].band) b.S = +e.ai[T.S].band;
  const v = Object.values(b); b.O = v.length === 4 ? engRound(v.reduce((a, c) => a + c, 0)/4) : null;
  return b;
}
function engTestView(x, d, i){
  const T = ENG_TEST[x.id], sec = (ui.engSec||{})[x.id] || "L", b = engTestBands(T);
  const nav = '<div class="eng-sec" role="tablist">'+ENG_SECS.map(([k, nm], j) => '<button role="tab" aria-selected="'+(k===sec)+'" class="'+(k===sec?'on':'')+'" data-act="engsec" data-t="'+x.id+'" data-s="'+k+'">'+(j+1)+'. '+nm+(b[k]!=null?' ✓':'')+'</button>').join("")+'</div>';
  let body = '';
  if (sec === "L") body = engListenView({id:T.L});
  else if (sec === "R") body = engReadView({id:T.R});
  else if (sec === "W") body = engWriteView({id:T.W}, d, -1);
  else if (sec === "S") body = engTestSpeak(T.S);
  else body = engTestResult(x.id, T, b, d, i);
  const nx = ENG_SECS.findIndex(s => s[0] === sec) + 1;
  return '<div class="card stack"><b>'+esc(T.title)+'</b><p class="small">'+esc(T.intro)+'</p>'+nav+'</div>'+body+
    (nx < ENG_SECS.length ? '<div class="row"><button class="btn solid" data-act="engsec" data-t="'+x.id+'" data-s="'+ENG_SECS[nx][0]+'">Lanjut ke '+ENG_SECS[nx][1]+' →</button></div>' : '');
}
function engTestSpeak(id){
  const Sp = ENG_SPEAK[id], e = E();
  const qrow = (q, k) => '<div class="eng-q"><div class="row"><button class="speak" data-act="engsq" data-id="'+id+'" data-k="'+k+'">▶</button><b>'+esc(q.q)+'</b></div><details><summary class="small">Jawaban model (buka setelah menjawab)</summary><div class="row" style="align-items:flex-start;margin-top:6px"><button class="speak" data-act="engsp" data-id="'+id+'" data-k="'+k+'">▶ Shadow</button><p class="small" style="flex:1">'+esc(q.m)+'</p></div></details></div>';

function engTestResult(tid, T, b, d, i){
  const row = (k, nm, how) => '<div class="ms"><b>'+nm+'</b><p class="small" style="margin:4px 0 0">'+(b[k]!=null ? '≈ band <b>'+b[k]+'</b>' : '<span class="muted">'+how+'</span>')+'</p></div>';

function engSummary(){
  const e = E(), lines = ["Ringkasan English "+ENG_DAYS.length+" hari (Ruang Belajar Nadia)", "Task selesai: "+engTotals().done+"/"+engTotals().all+" · streak "+engStreak()+" hari · kolokasi dikuasai "+engMastered()+"/36"];
  Object.keys(e.sc).sort().forEach(k => lines.push(k+": "+e.sc[k].s+"/"+e.sc[k].t));
  Object.keys(e.ai).forEach(k => { if (e.ai[k].band) lines.push(k+" band: "+e.ai[k].band); });
  ["Listening","Reading","Writing","Speaking"].forEach(s => { if (e.ev[s]) lines.push("Self-rating "+s+": "+e.ev[s]); });
  const src = {}; e.err.forEach(x => src[x.src] = (src[x.src]||0)+1); if (e.err.length) lines.push("Kesalahan per materi: "+Object.entries(src).map(([k,v]) => k+" "+v).join(", "));
  if (e.ev.sulit) lines.push("Paling sulit: "+e.ev.sulit); if (e.ev.fokus) lines.push("Fokus berikutnya: "+e.ev.fokus);
  return lines.join("\n");
}

});
document.addEventListener("input", e => {
  const t = e.target; if (!t.dataset) return;
  if (t.dataset.eq) { const X = E(); X.ans[t.dataset.eq] = X.ans[t.dataset.eq]||{}; X.ans[t.dataset.eq][t.dataset.k] = t.value; save(); }
  if (t.dataset.engtxt) { E().txt[t.dataset.engtxt] = t.value; save(); const w = $("#engWc"); if (w && ENG_WRITE[t.dataset.engtxt]) w.textContent = engWc(t.value)+" kata (min. "+ENG_WRITE[t.dataset.engtxt].minWords+")"; }
  if (t.dataset.engev && t.tagName === "TEXTAREA") { E().ev[t.dataset.engev] = t.value; save(); }
});
document.addEventListener("change", e => {
  const t = e.target; if (!t.dataset) return;
  if (t.id === "engTime" && t.value) { E().time = t.value; E().ack[todayISO()] = false; save(); render(); toast("Pengingat English jam "+t.value); }
  if (t.dataset.engband) { const X = E(), id = t.dataset.engband; X.ai[id] = Object.assign({}, X.ai[id], {band: t.value ? +t.value : null}); save(); }
  if (t.dataset.engev && t.tagName === "SELECT") { E().ev[t.dataset.engev] = t.value; save(); const s = $("#engSum"); if (s) s.textContent = engSummary(); }
});
document.addEventListener("click", e => { const a = e.target.closest && e.target.closest('#tabs a[href="#english"]'); if (a) { ui.engOpen = null; ui.engRev = null; engStop(); } }, true);

/* routing */
function go(v){ if (location.hash !== "#"+v) location.hash = v; else { view = v; render(); window.scrollTo({top:0}); } }
function fromHash(){ const h = (location.hash||"").replace("#",""); view = VIEWS.includes(h) ? h : "beranda"; render(); window.scrollTo({top:0}); }
window.addEventListener("hashchange", fromHash);

/* boot */
(function boot(){
  const local = lsGet(); if (local) S = merge(S, local); else if (window.SEED) S = merge(S, window.SEED);
  fromHash();
  setInterval(checkReminder, 30000); setTimeout(checkReminder, 1500);
  initDb();
})();
</script>
