<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF7FF"><link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Ruang Belajar">
<title>Ruang Belajar Nadia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: sticky name bar + scrollable tab strip, one working column (max 1080px), cards only where a thing is an object (lecture, question, layer). Single light "sorbet" world on purpose: Nadia asked for nothing dark. */
:root{
  --bg:#FBF7FF;        /* whisper lilac ground */
  --paper:#FFFFFF;
  --ink:#241B4B;       /* deep indigo ink */
  --muted:#6C6590;
  --line:#E7DEF8;
  --soft:#F3ECFF;
  --pop:#FF4F8B;       /* bubblegum: the one loud colour */
  --pop-soft:#FFE3EE;
  --peri:#5B6CFF;
  --peri-soft:#E6E9FF;
  --sun:#FFC83D;
  --sun-soft:#FFF4D1;
  --aqua:#11B3A3;
  --aqua-soft:#D9F7F3;
  --grape:#9B5CF6;
  --grape-soft:#EFE5FF;
  --ok:#0E9F77; --warn:#D98A00; --bad:#E5484D;
  --s1:#5B6CFF; --s2:#FF4F8B; --s3:#E0A400; --s4:#11B3A3; --s5:#9B5CF6;
  --f-display:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --f-body:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --r:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--peri)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:1.6rem;font-weight:800}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--peri);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
textarea{width:100%;min-height:80px;resize:vertical}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.eyebrow{font-family:var(--f-body);font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:14px}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.grid3{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.grid2>*,.grid3>*{min-width:0}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1.5px solid var(--line)}
.topbar{display:flex;align-items:center;gap:12px;padding-block:10px 6px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-badge{width:38px;height:38px;border-radius:12px;background:var(--pop);display:grid;place-items:center;flex:none}
.brand h1{font-size:1.25rem;font-weight:800;letter-spacing:-.01em}
.brand .sub{font-size:.78rem;color:var(--muted)}
.top-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 10px;font-size:.82rem;white-space:nowrap}
.chip.pop{background:var(--pop-soft);border-color:transparent;color:#B0124A}
.chip.peri{background:var(--peri-soft);border-color:transparent;color:#2C3BD1}
.chip.sun{background:var(--sun-soft);border-color:transparent;color:#8A5B00}
.chip.aqua{background:var(--aqua-soft);border-color:transparent;color:#05756A}
.chip.grape{background:var(--grape-soft);border-color:transparent;color:#6A2FC9}
.chip.bad{background:#FFE5E6;border-color:transparent;color:#B42328}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:4px 8px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--muted);font-weight:700;font-size:.92rem;padding:7px 12px;border-radius:999px;border:1.5px solid transparent}
nav.tabs a:hover{color:var(--ink);background:var(--soft)}
nav.tabs a[aria-current="page"]{color:#fff;background:var(--ink)}
main{padding-block:22px 80px}
section.view{display:grid;gap:22px}
.view-head{display:grid;gap:6px}
.view-head p{max-width:65ch;color:var(--muted)}

.card{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);padding:16px}
.card.flat{background:transparent}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:999px;border:1.5px solid var(--ink);background:var(--paper);padding:7px 14px;font-weight:700;font-size:.9rem;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--soft)}
.btn.solid{background:var(--ink);color:#fff}
.btn.solid:hover{background:#3A2F6E}
.btn.pop{background:var(--pop);border-color:var(--pop);color:#fff}
.btn.pop:hover{background:#E93C78}
.btn.ghost{border-color:var(--line)}
.btn.tiny{padding:3px 10px;font-size:.8rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* hero on beranda */
.hello{display:grid;gap:18px;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);align-items:stretch}
@media (max-width:760px){.hello{grid-template-columns:1fr}}
.hello-main{background:var(--ink);color:#fff;border-radius:22px;padding:22px;position:relative;overflow:hidden;display:grid;gap:12px;align-content:start}
.hello-main h2{font-size:clamp(1.6rem,4vw,2.3rem);color:#fff}
.hello-main .muted{color:#CFC8F0}
.hello-main .doodle{position:absolute;right:-20px;bottom:-24px;width:170px;opacity:.95;pointer-events:none}
.hello-main>*:not(.doodle){position:relative;z-index:1}
@media (max-width:760px){.hello-main .doodle{width:110px;right:-26px;top:-26px;bottom:auto;opacity:.5}.sync-chip{display:none}}
.count{display:flex;gap:16px;flex-wrap:wrap}
.count .n{font-family:var(--f-mono);font-size:2rem;font-weight:700;line-height:1}
.count .l{font-size:.75rem;color:#CFC8F0;letter-spacing:.08em;text-transform:uppercase}
.quote{background:var(--sun-soft);border-radius:22px;padding:20px;display:grid;gap:10px;align-content:space-between}
.quote blockquote{margin:0;font-family:var(--f-display);font-size:1.2rem;font-weight:700;line-height:1.3}

/* steps (milestones) */
.steps-legend{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.ms{border-radius:14px;padding:12px;display:grid;gap:4px;border:1.5px solid var(--line);background:var(--paper)}
.ms .ms-top{display:flex;gap:8px;align-items:center}
.ms .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--f-mono);font-weight:700;font-size:.8rem;flex:none}
.ms b{font-family:var(--f-display)}
.ms p{font-size:.84rem;color:var(--muted)}

.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper)}
.task.late{border-color:#F6C3C5;background:#FFF7F7}
.task .dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-family:var(--f-mono);font-weight:700}
.task .t{min-width:0}
.task .t b{display:block}
.task .t span{font-size:.84rem;color:var(--muted)}

/* lecture cards */
.lec{display:grid;gap:12px}
.lec-head{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.lec-no{font-family:var(--f-mono);font-weight:700;background:var(--soft);border-radius:8px;padding:2px 8px;font-size:.85rem}
.lec-title{flex:1;min-width:180px}
.lec-title h3{font-size:1.08rem}
.stepbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.stp{border:1.5px solid var(--line);border-radius:12px;padding:8px;display:grid;gap:4px;background:var(--paper);text-align:left;min-width:0}
.stp .nm{font-family:var(--f-display);font-weight:700;font-size:.86rem;line-height:1.1}
.stp .meta{font-size:.72rem;color:var(--muted);font-family:var(--f-mono)}
.stp.done{color:#fff;border-color:transparent}
.stp.done .meta{color:rgba(255,255,255,.85)}
.stp-actions{display:flex;gap:4px;flex-wrap:wrap}
@media (max-width:620px){.stepbar{grid-template-columns:repeat(5,minmax(58px,1fr));overflow-x:auto}.stp .nm{font-size:.76rem}}
.conf{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.conf button{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);font-family:var(--f-mono);font-weight:700}
.conf button.on{background:var(--pop);color:#fff;border-color:var(--pop)}
details.more>summary{cursor:pointer;color:var(--muted);font-size:.88rem;list-style:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"+ "}
details.more[open]>summary::before{content:"– "}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.form label{display:grid;gap:4px;font-size:.82rem;color:var(--muted);font-weight:700}

/* summaries */
.reader{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px;align-items:start}
@media (max-width:860px){.reader{grid-template-columns:minmax(0,1fr)}}
.prose,.reader > *{min-width:0}
.prose{max-width:68ch;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.prose h3{font-size:1.25rem;margin-top:10px;display:flex;gap:10px;align-items:baseline}
.prose h3 .lvl{font-family:var(--f-mono);font-size:.7rem;color:#fff;background:var(--peri);padding:2px 7px;border-radius:6px;letter-spacing:.06em}
.prose ul,.prose ol{margin:0;padding-left:1.2em;display:grid;gap:4px}
.prose table{border-collapse:collapse;width:100%;font-size:.9rem}
.prose th,.prose td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.prose th{background:var(--soft)}
.tbl{overflow-x:auto}
.term{background:linear-gradient(transparent 60%,var(--sun-soft) 60%);border-bottom:1.5px dotted var(--warn);cursor:help}
.box{border-radius:12px;padding:12px 14px;display:block}
.box > b:first-child{display:block;margin-bottom:6px}
.box > :last-child{margin-bottom:0}
.box.key{background:var(--peri-soft)}
.box.trap{background:var(--pop-soft)}
.box.clin{background:var(--aqua-soft)}
.box b.lab{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}
.side{position:sticky;top:120px;display:grid;gap:12px;max-height:calc(100vh - 140px);overflow:auto}
.toc button{display:block;width:100%;text-align:left;background:none;border:0;padding:5px 6px;border-radius:6px;font:inherit;font-size:.85rem;color:var(--ink);cursor:pointer}
.toc button:hover{background:var(--sun-soft)}
.prose h3[id]{scroll-margin-top:120px}
.prose h3[id]{background:var(--peri-soft);border-left:5px solid var(--peri);padding:9px 12px;border-radius:10px;margin-top:22px;color:var(--ink)}
.prose p.sub{font-weight:800;color:var(--peri);border-left:3px solid var(--peri);background:linear-gradient(90deg,var(--peri-soft),transparent);padding:4px 10px;border-radius:0 8px 8px 0;margin:8px 0 0}
.toc-m{display:none;padding:10px 12px}
.toc-m summary{cursor:pointer}
@media (max-width:860px){.toc-m{display:block}.toc-d{display:none}.prose h3[id]{scroll-margin-top:180px}}
@media (max-width:860px){.side{position:static}}
.gloss{max-height:60vh;overflow:auto;display:grid;gap:8px}
.gloss div{font-size:.86rem}
.gloss b{display:block;font-family:var(--f-display)}
.pop-tip{position:fixed;z-index:30;max-width:300px;background:var(--ink);color:#fff;padding:10px 12px;border-radius:10px;font-size:.86rem;box-shadow:0 10px 30px rgba(36,27,75,.25)}
.refs{font-size:.84rem;color:var(--muted);display:grid;gap:4px;padding-left:1.2em;margin:0}

/* anfisio */
.lab{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.lab{grid-template-columns:1fr}}
.svgbox{background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:8px;overflow-x:auto}
.svgbox svg{display:block;width:100%;height:auto;max-width:100%}
.layers{display:grid;gap:6px}
.layer{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);text-align:left}
.layer .sw{width:18px;height:18px;border-radius:5px;border:1.5px solid rgba(0,0,0,.15)}
.layer.off{opacity:.45}
.layer.focus{border-color:var(--ink)}
.info{border-radius:14px;padding:14px;background:var(--soft);display:grid;gap:8px}
.info h4{font-size:1.05rem}
.info dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:.9rem}
.info dt{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.info dd{margin:0}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtabs button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.88rem}
.subtabs button.on{background:var(--grape);border-color:var(--grape);color:#fff}
svg .hit{cursor:pointer}
svg .hit:hover{filter:brightness(1.08)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flow .node{background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.88rem}
.flow .arr{color:var(--muted);font-family:var(--f-mono)}

/* quiz */
.q{display:grid;gap:10px}
.q .stem{white-space:pre-line}
.opts{display:grid;gap:6px}
.qimg{display:block;max-width:100%;max-height:420px;border-radius:10px;border:1px solid var(--line);background:#fff;margin:4px 0}
.box.kat{background:var(--soft)}
.opt{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:start;text-align:left;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper)}
.opt .L{font-family:var(--f-mono);font-weight:700;width:26px;height:26px;border-radius:7px;background:var(--soft);display:grid;place-items:center}
.opt.sel{border-color:var(--peri);background:var(--peri-soft)}
.opt.sel .L{background:var(--peri);color:#fff}
.opt.right{border-color:var(--ok);background:#E3F8F0}
.opt.right .L{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:#FFECEC}
.opt.wrong .L{background:var(--bad);color:#fff}
.review{display:grid;gap:8px;border-top:1.5px dashed var(--line);padding-top:10px;font-size:.93rem}
.review ul{margin:0;padding-left:1.1em;display:grid;gap:3px}
.score{font-family:var(--f-display);font-size:3rem;font-weight:800;line-height:1}
.qnav{display:flex;flex-wrap:wrap;gap:4px}
.qnav a{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;text-decoration:none;font-family:var(--f-mono);font-size:.8rem;border:1.5px solid var(--line);color:var(--ink);background:var(--paper)}
.qnav a.ans{background:var(--peri-soft);border-color:transparent}
.qnav a.r{background:var(--ok);color:#fff;border-color:transparent}
.qnav a.w{background:var(--bad);color:#fff;border-color:transparent}

/* reasoning */
.case-stage{display:grid;gap:10px}
.reveal{border-left:4px solid var(--grape);padding:8px 12px;background:var(--grape-soft);border-radius:0 10px 10px 0}
.think{display:grid;gap:8px}
.ddx{display:flex;flex-wrap:wrap;gap:6px}
.ddx button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:.88rem}
.ddx button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ddx button.out{text-decoration:line-through;opacity:.5}
.ladder{display:grid;gap:8px;counter-reset:lad}
.ladder .rung{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.ladder .rung .k{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;color:#fff}

/* progress */
.meter{height:12px;border-radius:999px;background:var(--soft);overflow:hidden}
.meter>i{display:block;height:100%;border-radius:999px;background:var(--pop)}
.heat{border-collapse:separate;border-spacing:4px;font-size:.84rem}
.heat td,.heat th{padding:0}
.heat th{font-weight:700;text-align:left;padding-right:8px;white-space:nowrap}
.heat .c{width:30px;height:24px;border-radius:6px;background:var(--soft);display:grid;place-items:center;font-family:var(--f-mono);font-size:.7rem;color:#fff}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(110px,180px) 1fr 48px;gap:10px;align-items:center;font-size:.88rem}
.bar .meter>i{background:var(--peri)}

/* banner */
.banner{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:#fff;border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;max-width:min(560px,calc(100vw - 32px));box-shadow:0 14px 40px rgba(36,27,75,.3)}
.banner .btn{border-color:#fff;color:#fff;background:transparent}
.banner .btn.pop{background:var(--pop);border-color:var(--pop)}
.toast{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));top:calc(80px + env(safe-area-inset-top,0px));z-index:41;background:var(--aqua);color:#fff;padding:8px 14px;border-radius:12px;font-weight:700}
.empty{border:2px dashed var(--line);border-radius:16px;padding:20px;text-align:center;color:var(--muted)}
.speak{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 10px;font-size:.82rem;font-weight:700}
.speak.on{background:var(--grape);color:#fff;border-color:var(--grape)}
.ws-back{position:fixed;inset:0;z-index:35;background:rgba(36,27,75,.45);display:grid;place-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.ws{background:var(--bg);border-radius:20px;width:min(760px,100%);max-height:100%;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;box-shadow:0 20px 60px rgba(36,27,75,.35)}
.ws-head{padding:16px;display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.ws-body{padding:16px;overflow:auto;display:grid;gap:16px;align-content:start;min-height:0}
.ws-foot{padding:12px 16px;border-top:1.5px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--paper)}
@media (max-width:620px){.ws-back{padding:0}.ws{border-radius:0;height:100%;width:100%}.ws-head{padding-top:calc(16px + env(safe-area-inset-top,0px))}.ws-foot{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}}

/* latar gradasi warna (tanpa motif, sesuai permintaan Nadia) */
body{background-color:#F6EEFF;background-image:radial-gradient(1000px 700px at -5% -10%,#FFC6DD 0%,transparent 62%),radial-gradient(900px 700px at 105% 0%,#C9D0FF 0%,transparent 62%),radial-gradient(800px 700px at 0% 105%,#BFF0E6 0%,transparent 62%),radial-gradient(800px 600px at 105% 105%,#FFE7A8 0%,transparent 62%),linear-gradient(160deg,#FBEFFF,#EEF0FF 50%,#EFFBF8);background-attachment:fixed}
header.top{background:linear-gradient(90deg,rgba(255,227,238,.92),rgba(230,233,255,.92),rgba(217,247,243,.92))}
.view-head{background:linear-gradient(120deg,var(--pop-soft),var(--grape-soft) 55%,var(--peri-soft));border-radius:22px;padding:18px 20px;border:1.5px solid rgba(255,255,255,.7)}

const SUMMARIES_BUILTIN = [
{
  id:"sn-anak", lecture:null, title:"Sindrom Nefrotik pada Anak", updated:"2026-10-23",
  note:"Format rangkuman penyakit: 0. dasar normal → 1–15 struktur penyakit. Materi pelengkap pediatri (tidak terikat satu KUL), dilengkapi dari pedoman. Begitu PPT-nya dikirim, aku cocokkan dan tandai bagian yang beda.",
  sections:[
    {lvl:"Peta", h:"0.1. Gambaran besar dalam 30 detik", html:"<p>Sindrom nefrotik (SN) = <b>saringan ginjal bocor</b>, sehingga protein (terutama albumin) ikut keluar lewat urin dalam jumlah besar. Akibatnya kadar albumin darah turun, cairan merembes ke jaringan (bengkak), dan hati \"panik\" membuat lemak lebih banyak.</p><div class='box key'><b class='lab'>Rumus 4 serangkai</b><p>[[proteinuria masif]] + [[hipoalbuminemia]] + edema + [[hiperlipidemia]]</p></div><p>Pada anak, penyebab tersering adalah SN idiopatik dengan gambaran [[lesi minimal]], dan sebagian besar <b>respons baik dengan steroid</b>.</p>"},
    {lvl:"Dasar", h:"0.2. Fisiologi normal: saringan glomerulus", html:"<p>Darah disaring di glomerulus melewati 3 lapis saringan: (1) endotel kapiler yang berlubang-lubang ([[fenestrata]]), (2) [[membran basal glomerulus]] yang bermuatan negatif, dan (3) celah antar \"kaki\" [[podosit]] yang ditutup [[slit diaphragm]] (protein utamanya nefrin dan podosin).</p><p>Normalnya albumin hampir tidak lolos karena ukurannya besar dan muatannya negatif (ditolak muatan negatif membran basal).</p><div class='box clin'><b class='lab'>Hubungannya</b><p>Pada SN lesi minimal, kaki-kaki podosit \"meleleh\" dan merata ([[foot process effacement]]). Di mikroskop cahaya glomerulus tampak normal, kelainannya hanya terlihat dengan mikroskop elektron.</p></div><p class='small muted'>Lihat diagram nefron interaktif di menu Anat · Histo · Fisio.</p>"},
    {lvl:"Definisi", h:"1. Definisi", html:"<p>Sindrom nefrotik (SN) adalah <b>kumpulan gejala</b> (sindrom = kumpulan gejala, bukan satu penyakit tunggal) akibat kebocoran saringan glomerulus terhadap protein.</p><p><b>1.1. Kriteria diagnosis (IDAI 2012)</b></p><div class='tbl'><table><tr><th>Komponen</th><th>Batas pada anak</th></tr><tr><td>[[Proteinuria masif]]</td><td>&gt; 40 mg/m²/jam, atau rasio protein/kreatinin urin sewaktu &gt; 2 mg/mg, atau dipstik ≥ 2+</td></tr><tr><td>[[Hipoalbuminemia]]</td><td>Albumin serum &lt; 2,5 g/dL</td></tr><tr><td>Edema</td><td>Bengkak, bisa sampai [[edema anasarka]]</td></tr><tr><td>Hiperkolesterolemia</td><td>Dapat disertai, kolesterol &gt; 200 mg/dL</td></tr></table></div><p class='small muted'>Kenapa pakai rasio protein/kreatinin? Karena menampung urin 24 jam pada anak kecil itu sulit. Kreatinin keluar relatif konstan, jadi bisa dipakai sebagai \"penggaris\".</p>"},
    {lvl:"Epidemiologi", h:"2. Epidemiologi", html:"<ul><li>Penyakit glomerulus <b>tersering pada anak</b>.</li><li>Insidens sekitar 2–7 kasus per 100.000 anak per tahun di berbagai negara (lebih tinggi pada keturunan Asia Selatan).</li><li>Puncak onset usia <b>2–6 tahun</b>; pada usia muda laki-laki ± 2× lebih sering dari perempuan.</li><li>Sekitar 80–90% SN idiopatik anak <b>sensitif steroid</b>, dan sebagian besar dari mereka akan mengalami relaps setidaknya sekali.</li></ul><div class='box trap'><b class='lab'>Jebakan</b><p>Perbandingan laki-laki : perempuan 2 : 1 hanya berlaku pada anak kecil. Pada remaja dan dewasa perbandingannya hampir sama.</p></div>"},
    {lvl:"Etiologi", h:"3. Etiologi", html:"<p><b>3.1. Idiopatik (primer)</b>: penyebab pasti belum diketahui. Paling sering pada anak.</p><p><b>3.2. Sekunder</b>: akibat penyakit lain yang merusak glomerulus.</p><ul><li>Infeksi: hepatitis B, HIV, malaria, sifilis kongenital</li><li>Autoimun/vaskulitis: lupus (LES), purpura Henoch-Schönlein (vaskulitis IgA)</li><li>Obat dan toksin: OAINS, merkuri</li><li>Keganasan: limfoma</li></ul><p><b>3.3. Genetik/kongenital</b>: mutasi gen protein podosit, misalnya NPHS1 (nefrin) pada SN kongenital tipe Finlandia, NPHS2 (podosin) pada sebagian SN resisten steroid.</p>"},
    {lvl:"Klasifikasi", h:"4. Klasifikasi", html:"<p><b>4.1. Berdasarkan usia onset</b></p><ul><li>Kongenital: &lt; 3 bulan</li><li>Infantil: 3–12 bulan</li><li>Anak: &gt; 1 tahun (tersering)</li></ul><p><b>4.2. Berdasarkan histopatologi</b></p><ul><li>[[Lesi minimal]] (MCD): tersering pada anak (± 3/4 kasus pada studi ISKDC)</li><li>[[FSGS]]</li><li>Glomerulonefritis membranoproliferatif, nefropati membranosa, dll.</li></ul><p><b>4.3. Berdasarkan respons steroid (paling dipakai di klinik)</b></p><ul><li>Sensitif steroid: remisi dalam 4 minggu steroid dosis penuh</li><li>[[SN resisten steroid]]: tidak remisi setelah 4 minggu dosis penuh (IPNA 2023 menambah periode konfirmasi sebelum menyebut resisten)</li><li>Relaps jarang vs relaps sering: relaps sering = ≥ 2 kali dalam 6 bulan pertama setelah respons awal atau ≥ 4 kali dalam 1 tahun</li><li>Dependen steroid: relaps 2 kali berturut-turut saat dosis alternating atau dalam 14 hari setelah steroid dihentikan</li></ul>"},
    {lvl:"Faktor risiko", h:"5. Faktor risiko", html:"<ul><li>Usia 1–10 tahun, laki-laki</li><li>Keturunan Asia (terutama Asia Selatan)</li><li>Riwayat atopi (alergi) pada sebagian anak</li><li>Mutasi genetik podosit (untuk bentuk kongenital/resisten)</li><li>Infeksi yang mendasari (hepatitis B, HIV, malaria) untuk bentuk sekunder</li></ul><div class='box clin'><b class='lab'>Pemicu relaps</b><p>Infeksi saluran napas atas sering mendahului relaps. Itu sebabnya edukasi pencegahan infeksi penting.</p></div>"},
    {lvl:"Patofisiologi", h:"6. Patofisiologi", html:"<p><b>6.1. Pemicu di tingkat sel</b></p><ul><li>Pada lesi minimal, diduga ada gangguan sistem imun (limfosit T dan B) yang melepaskan [[faktor permeabilitas]] atau membuat antibodi.</li><li>Temuan baru: pada sebagian anak ditemukan <b>antibodi anti-nefrin</b>, yaitu antibodi yang menyerang nefrin di slit diaphragm (Hengel dkk., NEJM 2024).</li></ul><p><b>6.2. Dari molekul ke saringan bocor</b></p><div class='flow'><span class='node'>Sinyal imun / anti-nefrin</span><span class='arr'>→</span><span class='node'>Sitoskeleton aktin podosit berubah</span><span class='arr'>→</span><span class='node'>[[Foot process effacement]]</span><span class='arr'>→</span><span class='node'>Slit diaphragm rusak + muatan negatif hilang</span><span class='arr'>→</span><span class='node'>Albumin lolos</span></div><p><b>6.3. Dari bocor ke bengkak</b></p><div class='flow'><span class='node'>Albumin keluar lewat urin</span><span class='arr'>→</span><span class='node'>Albumin darah ↓</span><span class='arr'>→</span><span class='node'>[[Tekanan onkotik]] ↓</span><span class='arr'>→</span><span class='node'>Air pindah ke jaringan</span><span class='arr'>→</span><span class='node'>Edema</span></div><ul><li><b>[[Underfill]]</b>: volume pembuluh turun → RAAS dan ADH aktif → ginjal menahan garam dan air.</li><li><b>[[Overfill]]</b>: ginjal menahan natrium secara primer (enzim protease di urin mengaktifkan ENaC di duktus koligens), volume pembuluh normal/naik.</li></ul><p><b>6.4. Kenapa kolesterol naik?</b> Hati \"panik\" karena albumin rendah, lalu membuat banyak protein termasuk lipoprotein (pembawa kolesterol). Enzim pemecah lemak (lipoprotein lipase) juga berkurang.</p><p><b>6.5. Kenapa darah gampang membeku?</b> Antitrombin III (protein \"rem\" pembekuan) ikut bocor lewat urin, sementara hati membuat lebih banyak fibrinogen dan faktor pembekuan → [[hiperkoagulasi]].</p><p><b>6.6. Kenapa gampang infeksi?</b> IgG dan faktor komplemen ikut bocor, ditambah efek steroid dan cairan asites yang jadi \"kolam\" kuman.</p>"},
    {lvl:"Klinis", h:"7. Manifestasi klinis", html:"<ul><li><b>Bengkak kelopak mata saat bangun tidur</b> → karena saat berbaring cairan berkumpul di jaringan longgar wajah.</li><li>Siang hari bengkak pindah ke tungkai → efek gravitasi.</li><li>Perut membesar ([[asites]]), bengkak skrotum/labia → cairan mengisi rongga dan jaringan longgar.</li><li><b>Urin berbuih</b> → protein di urin menurunkan tegangan permukaan seperti sabun.</li><li>Berat badan naik → bukan gemuk, tapi air.</li><li>Pada lesi minimal: biasanya tekanan darah normal dan tidak ada hematuria makroskopik.</li><li>Tanda bahaya: nyeri perut + demam (curiga peritonitis), sesak (efusi pleura), tangan-kaki dingin + nadi cepat (hipovolemia).</li></ul>"},
    {lvl:"Diagnosis", h:"8. Alur penegakan diagnosis", html:"<div class='flow'><span class='node'>Anak edema</span><span class='arr'>→</span><span class='node'>Dipstik urin: protein ≥ 2+</span><span class='arr'>→</span><span class='node'>Rasio protein/kreatinin urin &gt; 2 mg/mg</span><span class='arr'>→</span><span class='node'>Albumin &lt; 2,5 g/dL (± kolesterol tinggi)</span><span class='arr'>→</span><span class='node'>SN tegak</span></div><p><b>8.1. Lalu tentukan tipikal atau tidak</b></p><ul><li><b>Tipikal</b> (arah lesi minimal): usia 1–10 th, tanpa hematuria makroskopik, tekanan darah normal, C3 normal, fungsi ginjal normal → mulai steroid tanpa biopsi.</li><li><b>Tidak tipikal</b>: usia &lt; 1 th, hematuria nyata, hipertensi menetap, C3 rendah, kreatinin naik, atau tidak respons steroid → rujuk ke nefrologi anak, pertimbangkan biopsi.</li></ul>"},
    {lvl:"DD", h:"9. Diagnosis banding", html:"<div class='tbl'><table><tr><th>Diagnosis</th><th>Clue pembeda</th></tr><tr><td>Sindrom nefritik (GNAPS)</td><td>Hematuria/urin seperti teh, hipertensi, oliguria, riwayat faringitis/impetigo 1–3 minggu sebelumnya, C3 rendah</td></tr><tr><td>Gagal jantung</td><td>Sesak, ortopnea, hepatomegali, peningkatan JVP, proteinuria tidak masif</td></tr><tr><td>Penyakit hati kronik</td><td>Ikterus, stigmata hati, albumin rendah tanpa proteinuria</td></tr><tr><td>Malnutrisi (kwashiorkor)</td><td>Asupan buruk, kelainan kulit dan rambut, tanpa proteinuria</td></tr><tr><td>Protein-losing enteropathy</td><td>Diare kronik, albumin rendah tanpa proteinuria</td></tr><tr><td>Angioedema/alergi</td><td>Mendadak, gatal/urtikaria, proteinuria negatif</td></tr></table></div><div class='box key'><b class='lab'>Kunci</b><p>Albumin rendah + edema tapi proteinuria negatif → bukan SN. Cari masalah di hati, usus, atau gizi.</p></div>"},
    {lvl:"Penunjang", h:"10. Pemeriksaan penunjang", html:"<ul><li><b>Urin</b>: urinalisis (protein, eritrosit, silinder), rasio protein/kreatinin urin sewaktu (atau urin 24 jam bila bisa).</li><li><b>Darah</b>: albumin, kolesterol/profil lipid, ureum-kreatinin, elektrolit, darah lengkap.</li><li><b>Untuk mencari penyebab atau atipikal</b>: C3 (C4, ANA bila curiga lupus), HBsAg, anti-HCV, HIV sesuai indikasi.</li><li><b>Sebelum steroid jangka panjang</b>: uji tuberkulin di daerah endemis TB.</li><li><b>Biopsi ginjal</b>: tidak rutin; untuk SN resisten steroid, onset &lt; 1 tahun, atau gambaran tidak tipikal.</li></ul>"},
    {lvl:"Farmako", h:"11. Tatalaksana farmakologis", html:"<p><b>11.1. Steroid inisial (IDAI 2012, berdasar ISKDC)</b></p><ol><li>Prednison <b>60 mg/m²/hari</b> (atau 2 mg/kgBB/hari), maksimal 80 mg/hari, dosis terbagi, selama <b>4 minggu</b>.</li><li>Lanjut <b>40 mg/m²</b> (2/3 dosis awal) [[dosis alternating]], dosis tunggal pagi, selama <b>4 minggu</b>.</li></ol><p class='small muted'>Dosis dihitung dari [[LPB]] supaya anak yang berat badannya naik karena edema tidak kelebihan dosis.</p><p><b>11.2. Relaps</b>: prednison dosis penuh sampai remisi, lalu dilanjutkan dosis alternating 4 minggu (IDAI 2012).</p><p><b>11.3. Relaps sering, dependen, atau resisten steroid</b>: obat hemat steroid seperti siklofosfamid, levamisol, inhibitor kalsineurin (siklosporin, takrolimus), mikofenolat, rituksimab. Diputuskan oleh dokter spesialis anak konsultan nefrologi.</p><p><b>11.4. Edema</b>: diuretik (furosemid ± spironolakton) dengan hati-hati karena bisa memperberat hipovolemia. Infus albumin 20–25% hanya untuk edema berat/refrakter atau hipovolemia, diikuti furosemid.</p><p><b>11.5. Proteinuria menetap / SN resisten</b>: ACE inhibitor atau ARB untuk menurunkan proteinuria.</p><div class='box trap'><b class='lab'>Jebakan dosis</b><p>60 mg/m²/hari (fase harian) vs 40 mg/m² alternating (fase lanjutan); 4 minggu + 4 minggu. IPNA 2023 dan KDIGO 2021 memakai pola serupa dengan batas maksimal dosis yang sedikit berbeda. Untuk ujian, ikuti versi PPT dosen, dan tanya dosen kalau berbeda.</p></div>"},
    {lvl:"Non-farmako", h:"12. Tatalaksana non-farmakologis", html:"<ul><li><b>Diet protein normal</b> sesuai kebutuhan (IDAI: 1,5–2 g/kgBB/hari). Diet tinggi protein tidak dianjurkan karena menambah beban kerja glomerulus tanpa menaikkan albumin.</li><li><b>Rendah garam</b> (1–2 g/hari) hanya selama edema.</li><li>Tirah baring tidak perlu dipaksakan; aktivitas sesuai kemampuan anak.</li><li>Pantau berat badan, tekanan darah, dan dipstik urin harian selama fase aktif.</li><li>Rawat inap bila edema berat, curiga infeksi berat, hipovolemia, atau untuk edukasi awal.</li></ul>"},
    {lvl:"KIE", h:"13. KIE (komunikasi, informasi, edukasi)", html:"<ul><li>SN adalah penyakit yang <b>bisa kambuh</b>; kebanyakan anak membaik dan fungsi ginjalnya tetap baik bila sensitif steroid.</li><li>Ajari orang tua <b>cek dipstik urin pagi</b> di rumah dan mencatatnya di buku harian.</li><li>Steroid <b>tidak boleh dihentikan mendadak</b>; minum pagi hari untuk dosis alternating.</li><li>Jelaskan efek samping steroid: wajah bulat (Cushingoid), nafsu makan naik, perubahan mood, tekanan darah naik, gangguan tumbuh bila jangka panjang.</li><li>Tanda harus segera ke dokter: demam, nyeri perut, sesak, bengkak makin berat, jarang kencing, lemas/dingin.</li></ul>"},
    {lvl:"Pencegahan", h:"14. Pencegahan", html:"<ul><li>SN idiopatik belum bisa dicegah, jadi fokusnya <b>mencegah relaps dan komplikasi</b>.</li><li>Cegah infeksi: cuci tangan, hindari kontak dengan anak sakit saat dosis steroid tinggi.</li><li>Vaksinasi: pneumokokus dan influenza dianjurkan; vaksin hidup ditunda selama steroid dosis tinggi dan beberapa waktu setelahnya (ikuti jadwal IDAI).</li><li>Deteksi dini relaps dengan dipstik rutin supaya terapi dimulai sebelum edema berat.</li></ul>"},
    {lvl:"Komplikasi", h:"15. Komplikasi", html:"<ul><li><b>Infeksi</b>: [[peritonitis bakterial spontan]] (tersering <i>Streptococcus pneumoniae</i>), selulitis, sepsis.</li><li><b>Trombosis</b>: vena renalis, vena dalam, sinus vena serebral.</li><li><b>Hipovolemia</b> sampai syok, terutama setelah diuretik atau diare.</li><li><b>Gangguan ginjal akut</b>.</li><li><b>Hiperlipidemia</b> jangka panjang.</li><li><b>Efek samping steroid</b>: Cushingoid, hipertensi, gangguan tumbuh, osteoporosis, katarak.</li><li>Hipokalsemia (protein pengikat vitamin D ikut bocor), hipotiroid ringan (protein pengikat tiroid ikut bocor).</li></ul>"},
    {lvl:"Ringkas", h:"16. Ringkasan 1 menit sebelum ujian", html:"<ul><li>4 serangkai: proteinuria masif, albumin &lt; 2,5, edema, kolesterol tinggi.</li><li>Anak 1–10 th tersering lesi minimal: mikroskop cahaya normal, effacement di mikroskop elektron, sensitif steroid.</li><li>Prednison 60 mg/m²/hari 4 minggu → 40 mg/m² alternating 4 minggu.</li><li>Komplikasi: infeksi (peritonitis S. pneumoniae), trombosis, hipovolemia, efek samping steroid.</li></ul>"}
  ],
  glossary:{
    "proteinuria masif":"Protein keluar lewat urin dalam jumlah sangat banyak (pada anak > 40 mg/m²/jam).",
    "hipoalbuminemia":"Kadar albumin dalam darah rendah. Hipo = kurang, -emia = dalam darah.",
    "hiperlipidemia":"Kadar lemak (kolesterol/trigliserida) darah tinggi.",
    "lesi minimal":"Minimal change disease. Glomerulus tampak normal di mikroskop cahaya, kelainan hanya di mikroskop elektron (kaki podosit merata).",
    "fenestrata":"Berlubang-lubang seperti jendela kecil (fenestra = jendela).",
    "membran basal glomerulus":"Lapisan tipis di antara endotel dan podosit, bermuatan negatif, bagian tengah saringan ginjal.",
    "podosit":"Sel epitel berkaki-kaki yang membungkus kapiler glomerulus. Celah antar kakinya jadi saringan terakhir.",
    "slit diaphragm":"Membran tipis penutup celah antar kaki podosit, tersusun dari protein nefrin, podosin, dll.",
    "foot process effacement":"Kaki-kaki podosit menyatu/merata sehingga saringan rusak. Tanda khas lesi minimal di mikroskop elektron.",
    "edema anasarka":"Bengkak menyeluruh di seluruh tubuh.",
    "FSGS":"Focal segmental glomerulosclerosis: sebagian (fokal) glomerulus mengalami parut (sklerosis) pada sebagian segmennya. Lebih sering resisten steroid.",
    "tekanan onkotik":"Tekanan yang \"menarik\" air ke dalam pembuluh darah, terutama dibuat oleh albumin.",
    "underfill":"Teori edema: pembuluh darah \"kurang isi\" sehingga tubuh mengaktifkan hormon penahan air dan garam.",

  {topic:"Fisiologi", stem:"Pada orang sehat, tekanan arteri rata-rata naik dari 100 ke 140 mmHg, tetapi laju filtrasi glomerulus hampir tidak berubah. Salah satu mekanismenya dimulai dari meningkatnya NaCl yang tiba di macula densa.\nRespons yang paling tepat setelah macula densa mendeteksi peningkatan NaCl adalah…",

  {topic:"Histologi", stem:"Bayi laki-laki usia 3 minggu dengan edema seluruh tubuh, proteinuria masif, dan albumin 1,2 g/dL. Riwayat lahir prematur dengan plasenta yang sangat besar (> 25% berat lahir). Analisis genetik menemukan mutasi pada protein utama penyusun slit diaphragm podosit.\nProtein yang paling mungkin mengalami mutasi adalah…",

  {topic:"Fisiologi", stem:"Seorang mahasiswa melakukan uji klirens inulin. Didapatkan kadar inulin urin 100 mg/mL, kadar inulin plasma 1 mg/mL, dan laju aliran urin 1,2 mL/menit.\nLaju filtrasi glomerulus mahasiswa tersebut adalah…",

  {topic:"Histologi", img:{fig:"nephron"}, stem:"[GAMBAR] Perhatikan skema nefron di atas.\nPada sediaan histologi, segmen ini dilapisi epitel kuboid selapis dengan brush border lebat, sitoplasma sangat eosinofilik karena banyak mitokondria, dan lumennya tampak sempit tidak rata. Segmen tersebut ditunjuk oleh huruf…",

  {topic:"Asam-basa", stem:"Anak perempuan 3 tahun dengan gagal tumbuh dan poliuria. Laboratorium: asidosis metabolik dengan anion gap normal, kalium 2,8 mEq/L, pH urin 6,8 walaupun pasien asidosis. USG: nefrokalsinosis bilateral.\nLokasi gangguan yang paling mungkin adalah…",

  {topic:"Anatomi", stem:"Laki-laki 19 tahun, tinggi dan kurus, mengeluh nyeri pinggang kiri hilang timbul dan hematuria mikroskopik. Pemeriksaan fisik: varikokel kiri. USG Doppler menunjukkan pembuluh yang terjepit di antara aorta abdominalis dan a. mesenterika superior.\nPembuluh yang terjepit adalah…",

  {topic:"Farmakologi", stem:"Perempuan 66 tahun dengan overactive bladder, mengeluh urgensi dan sering BAK malam. Ia memiliki riwayat glaukoma sudut tertutup sehingga dokter menghindari antimuskarinik. Dokter memilih obat yang bekerja pada reseptor yang secara fisiologis diaktifkan saraf hipogastrikus untuk merelaksasi otot detrusor saat fase pengisian.\nObat tersebut adalah golongan…",

  {topic:"Histologi", stem:"Biopsi dinding vesika urinaria seorang laki-laki menunjukkan epitel berlapis dengan sel permukaan berbentuk kubah, sebagian berinti dua. Mikroskop elektron memperlihatkan plak membran apikal yang kaku (asymmetric unit membrane) yang membuat epitel kedap terhadap urin.\nProtein utama penyusun plak tersebut adalah…",

  {topic:"Farmakologi", stem:"Laki-laki 54 tahun dengan DM tipe 2 mendapat empagliflozin. Satu minggu kemudian pemeriksaan urin menunjukkan glukosuria walaupun gula darah puasa 110 mg/dL.\nTarget molekuler obat tersebut adalah…",

  {topic:"Anatomi", stem:"Laki-laki 24 tahun terjatuh mengangkang di rangka sepeda. Ia tidak bisa BAK, ada darah di meatus uretra, dan hematom berbentuk kupu-kupu di perineum yang tidak meluas ke paha.\nBagian uretra yang paling mungkin cedera adalah…",

const LS_KEY = "nadia-ruang-belajar-v1";
const CLIENT = Math.random().toString(36).slice(2);
function freshState(){
  return {v:1, updatedAt:0, by:"", activeBlock:"uro",
    blocks: JSON.parse(JSON.stringify(BLOCKS_DEFAULT)),
    lectures: JSON.parse(JSON.stringify(LECTURES_DEFAULT)),
    steps:{}, slides:{}, conf:{}, quiz:{}, drafts:{}, times:{}, ack:{}, library:[], wins:[], why:"", watched:{}, caseNotes:{}, maxPerDay:4};
}
let S = freshState();
let db = null, stateRef = null, extra = window.KONTEN || {summaries:[], quizzes:[]};
let saveTimer = null, syncLabel = "tersimpan di perangkat ini";

function lsGet(){ try{ const t = localStorage.getItem(LS_KEY); return t ? JSON.parse(t) : null; }catch(e){ return null; } }
function lsSet(o){ try{ localStorage.setItem(LS_KEY, JSON.stringify(o)); }catch(e){} }
function merge(base, inc){ const out = Object.assign(freshState(), base, inc); addNewLectures(out); return out; }
/* KUL baru di LECTURES_DEFAULT ikut masuk ke data lama, kecuali yang pernah dihapus */
const LEC_REV = 5;
function addNewLectures(st){
  if (!st.seenLec) st.seenLec = (st.lectures||[]).map(l => l.id);
  /* rev 2: KUL 9-24 disamakan dengan nomor PDF 2026 */
  if ((st.lecRev||0) < LEC_REV){
    LECTURES_DEFAULT.forEach(d => { if (d.block !== "uro" || d.no < 9) return; const l = (st.lectures||[]).find(x => x.id === d.id); if (l){ l.title = d.title; l.en = d.en; l.no = d.no; if (d.tent) l.tent = true; else delete l.tent; } });
    /* rev 3: blok uro cuma 23 KUL, KUL 24 dihapus */
    st.lectures = (st.lectures||[]).filter(l => l.id !== "k24");
    /* rev 4: KUL default yang hilang dari daftar (padahal sudah tercatat 'seen') dimasukkan lagi, kecuali yang sengaja dihapus */
    st.lectures = st.lectures || [];
    LECTURES_DEFAULT.forEach(d => { if (!st.lectures.some(l => l.id === d.id) && (st.delLec||[]).indexOf(d.id) < 0) st.lectures.push(JSON.parse(JSON.stringify(d))); });
    const OLD_DATES = {"k1": "2026-09-29", "k2": "2026-10-01", "k3": "2026-10-06", "k4": "2026-10-08", "k5": "2026-10-13", "k6": "2026-10-15", "k7": "2026-10-20", "k8": "2026-10-22"};
    LECTURES_DEFAULT.forEach(d => { const l = st.lectures.find(x => x.id === d.id); if (l && (!l.date || l.date === OLD_DATES[d.id])) l.date = d.date; });
    st.lectures.sort((x,y) => (x.block===y.block ? (x.no||0)-(y.no||0) : 0));
    st.lecRev = LEC_REV;
  }
  LECTURES_DEFAULT.forEach(d => { if (st.seenLec.indexOf(d.id) < 0){ if (!(st.lectures||[]).some(l => l.id === d.id)) st.lectures.push(JSON.parse(JSON.stringify(d))); st.seenLec.push(d.id); } });
}

function save(){
  S.updatedAt = Date.now(); S.by = CLIENT;
  lsSet(S);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    if (!stateRef) return;
    try { await stateRef.set(JSON.parse(JSON.stringify(S))); syncLabel = "tersimpan di akunmu"; }
    catch(e){ syncLabel = "gagal sinkron, tersimpan di browser"; }
    paintTop();
  }, 700);
}

async function initDb(){
  try{
    if (!window.claude || !window.claude.use) return;
    db = await window.claude.use("db");
    if (!db) return;
    stateRef = db.doc("nadia/state");
    const snap = await stateRef.get();
    if (snap.exists){
      const remote = snap.data();
      if ((remote.updatedAt||0) >= (S.updatedAt||0)) { S = merge(S, JSON.parse(JSON.stringify(remote))); lsSet(S); }
      else { await stateRef.set(JSON.parse(JSON.stringify(S))); }
    } else if (S.updatedAt) {
      await stateRef.set(JSON.parse(JSON.stringify(S)));
    }
    syncLabel = "tersimpan di akunmu";
    stateRef.onSnapshot(s => {
      if (!s.exists) return; const r = s.data();
      if (r.by !== CLIENT && (r.updatedAt||0) > (S.updatedAt||0)) { S = merge(S, JSON.parse(JSON.stringify(r))); lsSet(S); render(); }
    }, () => {});
    db.collection("konten").onSnapshot(qs => {
      const sums = [], qzs = [];
      qs.docs.forEach(d => { const x = d.data(); if (!x) return; if (x.type === "rangkuman") sums.push(Object.assign({id:d.id}, x)); if (x.type === "latsol") qzs.push(Object.assign({id:d.id}, x)); });
      extra = {summaries:sums, quizzes:qzs}; render();
    }, () => {});
    render();
  }catch(e){ /* tetap jalan dengan penyimpanan browser */ }
}

const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayISO = () => { const d = new Date(); return iso(d); };
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDays(s, n){ const d = new Date(s+"T00:00:00"); d.setDate(d.getDate()+n); return iso(d); }
function diffDays(a, b){ return Math.round((new Date(b+"T00:00:00") - new Date(a+"T00:00:00"))/864e5); }
const HARI = ["Min","Sen","Sel","Rab","Kam","Jum","Sab"];
const BULAN = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
function fmt(s){ if(!s) return "—"; const d = new Date(s+"T00:00:00"); return HARI[d.getDay()]+", "+d.getDate()+" "+BULAN[d.getMonth()]; }
function block(){ return S.blocks.find(b => b.id === S.activeBlock) || S.blocks[0]; }
function lecs(){ return S.lectures.filter(l => l.block === S.activeBlock).sort((a,b) => (a.no||0) - (b.no||0) || (a.date||"9").localeCompare(b.date||"9")); }
function lecById(id){ return S.lectures.find(l => l.id === id); }
function stepOf(lid, n){ return ((S.steps[lid]||{})[n]) || {done:false, reps:0, last:null}; }
function allSummaries(){ return SUMMARIES_BUILTIN.concat(extra.summaries); }
function allQuizzes(){ return QUIZ_BUILTIN.concat(extra.quizzes); }
/* tiap KUL/rangkuman/latsol milik satu blok; yang tanpa KUL = materi lama Blok Uro */
function blockOfLid(lid){ const l = lecById(lid); if (l) return l.block; const d = LECTURES_DEFAULT.find(x => x.id === lid); return d ? d.block : (/^r\d/.test(lid||"") ? "repro" : "uro"); }
function inBlock(x){ return blockOfLid(x.lecture) === S.activeBlock; }
const isRepro = () => S.activeBlock === "repro";
function blockQuizzes(){ return allQuizzes().filter(inBlock); }
function organsOf(){ return isRepro() ? ORGANS_REPRO : ORGANS; }
function casesOf(){ return isRepro() ? CASES_REPRO : CASES; }
function yt(q){ return "https://www.youtube.com/results?search_query="+encodeURIComponent(q); }
function toast(t){ const el = document.createElement("div"); el.className="toast"; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(), 1800); }

/* jadwal milestone bertingkat: Tengkurap dari tanggal KUL, tiap tahap berikutnya = tanggal tahap sebelumnya selesai (atau jadwalnya) + jeda.
   Yang telat hanya tahap pertama yang belum selesai; tahap sesudahnya ikut bergeser. Lalu diratakan maks maxPerDay per hari. */
function schedule(){
  const b = block(); const lastDay = b.uab ? addDays(b.uab, -1) : null;
  const load = {}; const out = []; const t = todayISO();
  lecs().filter(l => l.date).forEach(l => {
    let prev = null;
    STEPS.forEach(st => {
      const sp = stepOf(l.id, st.n);
      const orig = prev ? addDays(prev, st.gap) : addDays(l.date, st.off);
      if (sp.done){ const dd = sp.last || orig; out.push({lid:l.id, n:st.n, due:dd, orig, late:false}); prev = dd; return; }
      let d = orig < t ? t : orig; /* yang terlewat dijadwal ulang mulai hari ini */
      if (lastDay && d > lastDay && lastDay >= t) d = lastDay;
      let guard = 0;
      while ((load[d]||0) >= (S.maxPerDay||4) && guard < 10){ const nd = addDays(d, 1); if (lastDay && nd > lastDay) break; d = nd; guard++; }
      load[d] = (load[d]||0) + 1;
      out.push({lid:l.id, n:st.n, due:d, orig, late: orig < t});
      prev = d;
    });
  });
  return out;
}

function streak(){
  const days = new Set(); Object.values(S.steps).forEach(o => Object.values(o).forEach(v => { if (v && v.last) days.add(v.last); (v.hist||[]).forEach(h => days.add(h)); }));

  if (/farmako|obat/.test(t)) return "farmako";
  if (/radiolog|imaging|pencitraan|ultrasonograf|kardiotokograf/.test(t)) return "radiologi";
  if (l && l.block === "repro") return "penyakit";
  if (/diet|gizi|nutrisi/.test(t)) return "gizi";
  if (/etik|euthanasia|medikolegal|hukum|humaniora/.test(t)) return "etik";
  if (/anatomi|histologi|fisiologi|embriolog|biokimia/.test(t)) return "dasar";
  return "penyakit";
}

   {f:"nefron-kapiler", cap:"Dua jaring kapiler berurutan: glomerulus (filtrasi) lalu kapiler peritubular/vasa rekta (reabsorpsi & sekresi). Inilah sistem porta arteri ginjal.", lab:"Glomerular capsule = kapsula Bowman · Proximal convoluted tubule = tubulus kontortus proksimal · Loop of the nephron = ansa Henle · Peritubular capillary = kapiler peritubular"},
   {f:"podosit", cap:"Podosit membungkus kapiler glomerulus dengan 'kaki' (pedisel) yang saling mengunci; celah di antaranya (slit) ditutup slit diaphragm (nefrin, podosin). Rusak → proteinuria (sindrom nefrotik).", lab:"Filtration slits = celah filtrasi · Cell bodies = badan sel podosit"},
   {f:"jga", cap:"Aparatus jukstaglomerular: makula densa (di tubulus distal) membaca NaCl, sel jukstaglomerular di arteriol aferen melepas renin.", lab:"Macula densa = makula densa · Juxtaglomerular cells = sel JG · DCT = tubulus distal"},
   {f:"tekanan-filtrasi", cap:"Tekanan filtrasi bersih (versi OpenStax): hidrostatik kapiler 55 − onkotik 30 − hidrostatik Bowman 15 = 10 mmHg. (Angka Guyton: 60 − 32 − 18 = 10 mmHg; hasil akhirnya sama.)", lab:"Blood hydrostatic = hidrostatik kapiler · Blood colloid osmotic = onkotik plasma · Capsular hydrostatic = hidrostatik Bowman"},
   {f:"countercurrent", cap:"Multiplikasi arus balik di ansa Henle: segmen desendens permeabel air, segmen asendens tebal memompa NaCl tapi kedap air → medula makin pekat (sampai ±1200 mOsm/kg).", lab:"Interstitial osmolality = osmolalitas interstisial"},
   {f:"raas", cap:"Sistem renin–angiotensin–aldosteron: renin (ginjal) → angiotensin I → ACE (paru) → angiotensin II → vasokonstriksi, aldosteron (retensi Na), ADH, haus.", lab:"Angiotensinogen dari hati · ACE dari paru · Adrenal cortex = korteks adrenal"}],
  anat:["Retroperitoneal, T12–L3; ginjal kanan lebih rendah (hati).","Pembungkus dari luar: lemak pararenal → fascia renalis (Gerota) → lemak perirenal → kapsula fibrosa.","Hilus setinggi L1; urutan depan → belakang: Vena, Arteri, Pelvis (VAP).","Posterior: diafragma, m. psoas, m. quadratus lumborum, iga XI–XII; anterior kanan: hati, duodenum, kolon; kiri: lambung, limpa, pankreas, kolon.","V. renalis kiri lebih panjang, melewati depan aorta di bawah a. mesenterika superior, menerima v. testikularis/ovarika kiri & v. suprarenalis kiri (dasar varikokel kiri, KUL 15/19).","Arteri segmental adalah end-artery (tanpa anastomosis) → sumbatan = infark segmental."],
  histo:["Korpuskulum renalis: glomerulus + kapsula Bowman (parietal skuamosa selapis, viseral = podosit).","Tubulus proksimal: kuboid selapis, brush border, sitoplasma sangat eosinofilik (banyak mitokondria), lumen tidak rata.","Ansa Henle tipis: skuamosa selapis; tebal: kuboid tanpa brush border.","Tubulus distal: kuboid, lumen lebih lebar & bersih, sel lebih pucat; makula densa di dekat kutub vaskular.","Duktus koligens: kuboid → kolumnar, batas sel jelas; sel principal (ENaC, AQP2) & interkalata (asam-basa).","Medula: berkas tubulus lurus & vasa rekta, tanpa glomerulus."],
  fisio:["Filtrasi ±180 L/hari (GFR ±125 mL/menit); reabsorpsi >99% air.","Proksimal: ±65% Na & air, semua glukosa & asam amino, ±80% HCO3⁻.","Ansa Henle tebal: NKCC2 (target furosemid), pembentuk gradien medula.","Distal: NCC (target tiazid), reabsorpsi Ca²⁺ diatur PTH.","Duktus koligens: aldosteron (ENaC), ADH (AQP2), sekresi K⁺ dan H⁺.","Endokrin: renin, eritropoietin, 1α-hidroksilase (vitamin D aktif)."],
  klinis:["Pielonefritis: nyeri ketok CVA karena kapsul teregang (KUL 9).","Sindrom nefrotik = podosit; nefritik = endotel/mesangium (KUL 13).","Tapal kuda tertahan a. mesenterika inferior (KUL 18).","ATN: S3 tubulus proksimal & mTAL paling rentan iskemia (KUL 20).","RCC dari tubulus proksimal, Wilms dari blastema metanefrik (KUL 19)."],
  tes:[["Urutan pembungkus ginjal dari luar ke dalam?","Lemak pararenal → fascia Gerota → lemak perirenal → kapsula fibrosa."],["Mengapa varikokel lebih sering kiri?","V. testikularis kiri panjang, sering tanpa katup, masuk tegak lurus ke v. renalis kiri (± dijepit a. mesenterika superior)."],["Segmen tubulus dengan brush border dan sitoplasma paling eosinofilik?","Tubulus kontortus proksimal."],["Sel yang mendeteksi NaCl dan sel yang melepas renin?","Makula densa (tubulus distal) dan sel jukstaglomerular (arteriol aferen)."]]},
 {id:"ureter", nm:"Ureter", kul:"KUL 18, 19, 21",
  imgs:[{f:"ureter-histo", cap:"Potongan melintang ureter (mikroskop cahaya): lumen berbentuk bintang karena lipatan mukosa, dilapisi urotel, lalu lapisan otot polos dan adventisia.", lab:"Lumen · Smooth muscle layer = lapisan otot polos · Adventitia = adventisia"}],
  anat:["Panjang ±25–30 cm, retroperitoneal, berjalan di atas m. psoas.","3 penyempitan fisiologis: UPJ, persilangan a. iliaka (pelvic brim), UVJ (paling sempit, batu paling sering tersangkut).","Pada laki-laki disilang vas deferens; pada perempuan berjalan di bawah a. uterina ('water under the bridge') → rawan terpotong saat histerektomi.","Masuk buli secara miring (terowongan intramural) → katup anti-refluks."],
  histo:["Mukosa: urotel (epitel transisional) + lamina propria; lumen bintang saat kosong.","Otot: 2/3 atas = longitudinal dalam + sirkular luar (terbalik dari usus); 1/3 bawah tambah longitudinal luar.","Adventisia: jaringan ikat longgar dengan pembuluh darah."],
  fisio:["Urin didorong oleh gelombang peristaltik (±1–5×/menit) yang dimulai pacemaker di kaliks/pelvis.","Gravitasi & tekanan cairan membantu.","Katup vesikoureter menutup saat buli berkontraksi → mencegah refluks."],
  klinis:["Kolik: spasme otot polos melawan batu, nyeri menjalar T10–L1 (KUL 21).","Refluks vesikoureter bila terowongan intramural pendek (KUL 18).","Duplikasi & hukum Weigert-Meyer (KUL 18).","Tumor urotelial atas: field change, cek buli (KUL 19)."],
  tes:[["Tiga tempat penyempitan ureter?","UPJ, persilangan a. iliaka, UVJ (paling sempit)."],["Susunan otot 2/3 atas ureter?","Longitudinal dalam, sirkular luar."]]},
 {id:"buli", nm:"Kandung kemih (buli)", kul:"KUL 9, 19, 21",
  imgs:[{f:"buli", cap:"(a) Buli potongan anterior: dinding otot detrusor, trigonum di antara dua muara ureter dan leher buli. (b) Mikroskop: urotel, lamina propria, submukosa.", lab:"Detrusor muscle = otot detrusor · Ureteral openings = muara ureter · Internal/External urethral sphincter = sfingter uretra interna/eksterna · Transitional epithelium = urotel"},
        {f:"buli-saraf", cap:"Persarafan berkemih: n. pelvikus (parasimpatis S2–S4) ke detrusor, n. hipogastrikus (simpatis T11–L2), n. pudendus (somatik S2–S4) ke sfingter eksterna.", lab:"Pudendal nerve = n. pudendus · Sphincter = sfingter"}],
  anat:["Kapasitas dewasa ±400–600 mL; anak (Koff) = (usia + 2) × 30 mL.","Trigonum: segitiga licin antara dua muara ureter dan leher buli (asal embriologis berbeda, tidak berlipat).","Laki-laki: di depan rektum, di atas prostat; perempuan: di depan uterus & vagina.","Saat penuh naik di atas simfisis → bisa dipungsi suprapubik tanpa menembus peritoneum."],
  histo:["Urotel: sel payung (umbrella cell) di permukaan dengan plak uroplakin; saat teregang epitel menipis (2–3 lapis), saat kosong tebal (5–7 lapis).","Lamina propria & submukosa tanpa kelenjar.","Detrusor: tiga lapis otot polos yang saling menjalin (tidak teratur)."],
  fisio:["Pengisian: simpatis (β3 relaksasi detrusor, α1 kontraksi leher buli) + sfingter eksterna kontraksi.","Pengosongan: pusat miksi pons → parasimpatis M3 → detrusor kontraksi, sfingter relaksasi.","Sensasi ingin berkemih pertama ±150 mL."],
  klinis:["Sistitis: FimH E. coli menempel uroplakin sel payung (KUL 9).","Karsinoma urotelial: hematuria tanpa nyeri (KUL 19).","Batu buli pada BPH (KUL 17, 21).","Obat: antimuskarinik (OAB), mirabegron (β3), α-bloker (BPH)."],
  tes:[["Reseptor yang membuat detrusor berkontraksi?","Muskarinik M3 (parasimpatis S2–S4, n. pelvikus)."],["Mengapa urotel bisa meregang?","Sel payung dengan plak uroplakin dan sel yang bisa merata; jumlah lapis tampak berkurang saat teregang."]]},
 {id:"uretra", nm:"Uretra", kul:"KUL 9, 10, 11, 14",
  imgs:[{f:"uretra", cap:"(a) Uretra perempuan pendek (±4 cm) dan dekat vagina-anus → ISK lebih sering. (b) Uretra laki-laki ±18–20 cm melewati prostat dan penis.", lab:"Urethra = uretra · Prostate gland = prostat · Seminal vesicle = vesikula seminalis · Ductus deferens = vas deferens · Epididymis = epididimis · Foreskin = preputium"}],
  anat:["Laki-laki: pars prostatika (±3–4 cm, muara duktus ejakulatorius di kolikulus seminalis) → membranasea (±1–1,5 cm, melewati sfingter eksterna, paling mudah cedera kateter/fraktur pelvis) → spongiosa/penil (±15 cm: bulbar, penil, fossa navikularis).","Perempuan ±4 cm, muara di vestibulum antara klitoris dan introitus.","Kelenjar bulbouretralis (Cowper) bermuara di uretra bulbar; kelenjar Littré sepanjang uretra penil."],
  histo:["Prostatika: urotel.","Membranasea & spongiosa: berlapis/bertingkat silindris (stratified/pseudostratified columnar).","Fossa navikularis: berlapis gepeng (skuamosa)."],
  fisio:["Sfingter interna (otot polos, α1, involunter) & eksterna (otot rangka, n. pudendus, volunter).","Pada ejakulasi sfingter interna menutup agar semen tidak masuk buli."],
  klinis:["Uretritis GO/klamidia menyerang epitel silindris (KUL 11).","Hipospadia/epispadia = muara uretra salah tempat (KUL 14).","Ejakulasi retrograd bila leher buli gagal menutup (KUL 16).","Ruptur uretra posterior pada fraktur pelvis (membranasea)."],
  tes:[["Bagian uretra laki-laki yang paling pendek dan paling mudah cedera?","Pars membranasea."],["Epitel fossa navikularis?","Berlapis gepeng."]]},
 {id:"testis", nm:"Testis & skrotum", kul:"KUL 10, 15, 16, 17",
  imgs:[{f:"skrotum", cap:"Lapisan skrotum: kulit dengan rafe, otot dartos, otot kremaster; di dalamnya funikulus spermatikus (vas deferens, a. testikularis, pleksus pampiniformis, saraf, limfe).", lab:"Scrotal septum = septum skrotum · Cremaster/Dartos muscles = otot kremaster/dartos · Plexus of testicular veins = pleksus pampiniformis · Spermatic cord = funikulus spermatikus"},
        {f:"testis", cap:"Testis potongan sagital: tunika albuginea, septa membagi lobulus berisi tubulus seminiferus → tubulus rektus → rete testis → duktus eferen → kepala, badan, ekor epididimis → vas deferens.", lab:"Tunica albuginea · Tunica vaginalis · Seminiferous tubule = tubulus seminiferus · Rete testis · Efferent ductule = duktus eferen · Head/Body/Tail of epididymis = kaput/korpus/kauda epididimis"},
        {f:"spermatogenesis", cap:"(b) Penampang tubulus seminiferus (mikroskop): spermatogonia di basal, spermatosit primer, spermatid, sperma di lumen; sel Sertoli menyokong; sel Leydig di interstisium.", lab:"Sertoli cell = sel Sertoli · Leydig (interstitial) cells = sel Leydig · Spermatogonia · Primary spermatocyte = spermatosit primer · Spermatids = spermatid"},
        {f:"sperma", cap:"Sperma: kepala (inti DNA + akrosom berisi enzim penembus zona pelusida), bagian tengah (mitokondria), ekor (flagel).", lab:"Acrosome = akrosom · Mid-piece = bagian tengah · Tail = ekor"},
        {f:"aksis-hpg", cap:"Aksis hipotalamus–hipofisis–testis: GnRH → LH (sel Leydig → testosteron) & FSH (sel Sertoli → ABP, inhibin); testosteron & inhibin memberi umpan balik negatif.", lab:"FSH/LH release · Inhibin · Testosterone = testosteron · ABP = androgen-binding protein"}],
  anat:["Lapisan skrotum dari luar: kulit → dartos → fasia spermatika eksterna → kremaster → fasia spermatika interna → tunika vaginalis (parietal & viseral) → tunika albuginea.","A. testikularis langsung dari aorta (L2); vena kanan → v. kava, vena kiri → v. renalis kiri.","Limfe testis → KGB para-aorta; limfe skrotum → KGB inguinal (alasan orkidektomi lewat inguinal).","Refleks kremaster: n. genitofemoral L1–L2."],
  histo:["Tubulus seminiferus: epitel germinal berlapis (spermatogonia → spermatosit → spermatid → sperma) + sel Sertoli (sawar darah-testis, tight junction).","Interstisium: sel Leydig (sitoplasma eosinofilik, kristal Reinke) → testosteron.","Tunika albuginea: jaringan ikat padat, tidak elastis."],
  fisio:["Spermatogenesis ±64–74 hari; butuh suhu 2–3 °C lebih rendah (pleksus pampiniformis, dartos, kremaster).","LH → Leydig → testosteron; FSH + testosteron → Sertoli → spermatogenesis, ABP, inhibin.","Testosteron → DHT (5α-reduktase) untuk prostat & genitalia eksterna."],
  klinis:["Torsio (bell-clapper), UDT, hidrokel, varikokel (KUL 15).","Orkitis mumps → atrofi karena tunika albuginea tidak elastis (KUL 10).","Tumor sel germinal 90%; limfe ke para-aorta (KUL 17).","Andropause: sel Leydig berkurang (KUL 16)."],
  tes:[["Sel penghasil testosteron dan sel penghasil inhibin?","Sel Leydig (testosteron) dan sel Sertoli (inhibin, ABP)."],["Ke mana limfe testis mengalir?","KGB para-aorta/retroperitoneal setinggi ginjal."],["Lapisan yang berisi cairan pada hidrokel?","Di antara lapisan parietal dan viseral tunika vaginalis."]]},
 {id:"saluran", nm:"Epididimis, vas, vesikula & prostat", kul:"KUL 10, 16, 17",
  imgs:[{f:"genital-pria", cap:"(c) Sistem reproduksi pria tampak lateral: vas deferens naik lewat kanalis inguinalis, melengkung di belakang buli, ampula + vesikula seminalis = duktus ejakulatorius yang menembus prostat ke uretra prostatika.", lab:"Ductus (vas) deferens · Ampulla · Seminal vesicle = vesikula seminalis · Ejaculatory duct = duktus ejakulatorius · Prostate gland = prostat · Bulbourethral gland = kelenjar Cowper"},
        {svg:"prostat", cap:"Zona prostat menurut McNeal (skema sendiri): perifer ±70% (asal ±75% kanker, teraba saat colok dubur), transisi ±5% (asal BPH, mengelilingi uretra), sentral ±25% (mengelilingi duktus ejakulatorius), stroma fibromuskular anterior."}],
  anat:["Epididimis: kaput (menerima duktus eferen), korpus, kauda (penyimpanan sperma) di posterolateral testis.","Vas deferens ±45 cm, dinding otot tebal (teraba seperti tali keras di funikulus) → ampula.","Vesikula seminalis di belakang buli; bergabung dengan ampula = duktus ejakulatorius.","Prostat ±20 g di bawah buli, mengelilingi uretra; posterior dipisahkan dari rektum oleh fasia Denonvilliers."],
  histo:["Epididimis: epitel bertingkat silindris (pseudostratified) dengan stereosilia; lumen rata berisi sperma.","Vas deferens: lumen kecil, mukosa berlipat, otot polos sangat tebal (longitudinal dalam, sirkular tengah, longitudinal luar).","Vesikula seminalis: mukosa sangat berlipat seperti sarang lebah, epitel bertingkat/selapis silindris.","Prostat: kelenjar tubuloalveolar dengan stroma fibromuskular; korpora amilasea (konkresi) di lumen, makin banyak dengan usia."],
  fisio:["Epididimis: pematangan sperma ±2 minggu (motilitas & kemampuan membuahi).","Komposisi semen: vesikula ±60–70% (fruktosa, semenogelin), prostat ±25–30% (PSA, zinc, sitrat), sisanya sperma & Cowper.","Urutan ejakulasi: cairan prostat → sperma → cairan vesikula seminalis.","Emisi oleh simpatis T10–L2; propulsi oleh n. pudendus."],
  klinis:["Epididimitis: pria muda = IMS, tua = E. coli (KUL 10).","Prostatitis & uji 4 tabung Meares-Stamey (KUL 10).","BPH zona transisi, kanker zona perifer (KUL 17).","Ejakulasi retrograd pasca-TURP (KUL 16)."],
  tes:[["Epitel epididimis dan ciri khas permukaannya?","Bertingkat silindris dengan stereosilia."],["Zona prostat asal BPH dan asal kanker?","Transisi (BPH), perifer (kanker)."],["Kelenjar penyumbang volume semen terbesar?","Vesikula seminalis (fruktosa)."]]},
 {id:"penis", nm:"Penis", kul:"KUL 14, 16, 17",
  imgs:[{f:"penis", cap:"Penis flasid vs ereksi: dua korpus kavernosum (dorsal) dan satu korpus spongiosum (ventral, berisi uretra). Saat ereksi a. kavernosa melebar, sinusoid terisi, vena subtunika tertekan ke tunika albuginea (veno-oklusi).", lab:"Corpora cavernosa = korpus kavernosum · Corpus spongiosum = korpus spongiosum · Spongy urethra = uretra spongiosa · Deep dorsal vein = v. dorsalis profunda · Cavernosal arteries = a. kavernosa · Prepuce = preputium"},
        {f:"genital-pria", cap:"(a–b) Penis tidak disirkumsisi vs disirkumsisi: preputium menutupi glans; korona dan glans tampak setelah sirkumsisi.", lab:"Prepuce (foreskin) = preputium · Glans penis · Corona = korona"}],
  anat:["Tiga silinder: 2 korpus kavernosum (dorsal) + korpus spongiosum (ventral, ujungnya glans).","Pembungkus: tunika albuginea → fasia Buck → fasia dartos → kulit.","Neurovaskular dorsal di jam 12, uretra di jam 6 → aspirasi priapismus di jam 3/9.","Darah: a. pudenda interna → a. kavernosa (sentral), a. dorsalis, a. bulbouretralis; limfe kulit/glans → KGB inguinal."],
  histo:["Jaringan erektil: ruang sinusoid berlapis endotel dipisahkan trabekula otot polos.","Tunika albuginea: kolagen padat dua lapis, sangat kuat; lebih tipis di sekitar spongiosum.","Uretra spongiosa: epitel bertingkat silindris; fossa navikularis berlapis gepeng."],
  fisio:["Ereksi: parasimpatis S2–S4/NANC → NO → cGMP → relaksasi otot polos → sinusoid terisi → veno-oklusi.","Detumesen: simpatis + PDE5 memecah cGMP.","Fase: flasid → pengisian → tumesen → ereksi penuh → rigid (iskiokavernosus) → detumesen."],
  klinis:["Hipospadia, fimosis/parafimosis, priapismus, Peyronie (KUL 14).","Disfungsi ereksi & PDE5i (KUL 16).","Karsinoma penis, faktor risiko fimosis (KUL 17).","Gangren Fournier menjalar di fasia dartos–Colles–Scarpa (KUL 10)."],
  tes:[["Mengapa aspirasi priapismus di jam 3 atau 9?","Hindari neurovaskular dorsal (jam 12) dan uretra/spongiosum (jam 6)."],["Mekanisme veno-oklusi?","Sinusoid yang terisi menekan vena subtunika ke tunika albuginea yang tidak elastis."]]}

 {id:"panggul", nm:"Panggul & jalan lahir", kul:"KUL 7, 8, 10",
